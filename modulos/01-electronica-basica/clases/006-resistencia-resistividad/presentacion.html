<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Presentación · Resistencia eléctrica y resistividad</title><style>*{box-sizing:border-box}body{margin:0;background:#fcfaf4;color:#172d47;font:17px/1.6 system-ui,sans-serif}header{background:#10243a;color:white;padding:16px 5%;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}header a{color:#7ddddd}main{max-width:1150px;margin:20px auto;display:grid;grid-template-columns:255px 1fr;gap:18px;padding:0 16px}aside,article{background:white;border:1px solid #dce5ec;border-radius:18px;padding:22px}aside{align-self:start;position:sticky;top:12px}aside a{display:block;color:#496579;text-decoration:none;font-size:14px;padding:6px 8px}aside a.active{background:#ddf6eb;font-weight:700}h1{font-size:clamp(27px,4vw,40px);line-height:1.15}h2{font-size:21px;color:#087f75}p{margin:8px 0 15px}img,svg{width:100%;height:auto;border-radius:12px}.nav{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:14px 0}button,.btn{padding:10px 13px;border-radius:9px;border:1px solid #087f75;background:#fff;color:#087f75;font:inherit;text-decoration:none;cursor:pointer}.primary{background:#087f75;color:white}button:disabled{opacity:.4}progress{width:100%;accent-color:#087f75}.example,.task,.explain{padding:13px 17px;border-radius:12px;background:#fff2d9;margin:14px 0}.task{background:#e4f1fe}.explain{background:#ddf6eb}.small{font-size:13px;color:#52677d}a{color:#087f75}footer{text-align:center;padding:20px;color:#52677d;font-size:13px}@media(max-width:760px){main{grid-template-columns:1fr}aside{position:static}aside nav{max-height:180px;overflow:auto}}@media print{aside,header,.nav,footer{display:none}main{display:block}article{border:0}}</style></head><body><header><strong>Academia Sistemas · Clase 006</strong><a href="../../../../index.html">Inicio</a></header><main style="display:block;max-width:1100px"><article><div class="nav"><button id="prev">← Anterior</button><span id="count"></span><button id="next" class="primary">Siguiente →</button></div><section id="page"></section><p><a href="libro.html">Volver al libro</a></p></article></main><footer>Del electrón al software · Modelos didácticos, no a escala</footer><script>const pages=[["Resistencia y resistor","La resistencia eléctrica cuantifica la oposición al transporte de corriente en una condición dada. Un resistor es un componente diseñado para presentar cierta resistencia. En un elemento óhmico R=V/I es constante a temperatura aproximadamente fija. La unidad es el ohmio (Ω=V/A).","Un resistor con 2 V y 0,01 A presenta 200 Ω.","Si V=4 V e I=0,02 A, calcula R.","200 Ω.","Tensión aplicada → resistor → corriente"],["Origen microscópico","En un metal, el campo acelera portadores entre interacciones de dispersión con vibraciones de la red, impurezas y defectos. La dispersión limita la deriva y facilita transferencia de energía al material. El modelo no describe electrones como bolitas chocando literalmente; la física microscópica es cuántica.","Al calentarse muchos metales, aumentan las vibraciones y su resistencia tiende a crecer.","¿El resistor consume electrones?","No; transfiere energía al material y al entorno.","Campo → dispersión → calor"],["Resistividad: propiedad del material","La resistividad ρ expresa cuánto se opone un material al transporte en condiciones especificadas. Se mide en Ω·m. En una pieza homogénea de sección uniforme, R=ρL/A. Un metal y un aislante pueden tener resistividades muy diferentes; temperatura y composición importan.","Con igual L y A, un material con doble ρ tiene doble R.","Si dos cables tienen igual geometría y ρB=3ρA, compara R.","RB=3RA.","Material A → ρ baja | material B → ρ alta"],["Longitud: más recorrido","Al duplicar L con la misma sección y resistividad, R se duplica. Se puede interpretar como dos tramos iguales en serie. No es correcto afirmar que todos los cables largos tienen más resistencia que cualquier cable corto: también importa A y ρ.","R=0,5 Ω a 1 m; a 4 m con igual A y ρ será 2 Ω.","Una pieza de 3 Ω mide 2 m; ¿R a 6 m?","9 Ω.","L → 2L → 2R"],["Área y diámetro","La sección transversal A representa el espacio disponible para transporte. Al duplicar A, R se reduce a la mitad. Para un conductor circular A=πd²/4: duplicar el diámetro cuadruplica A, por lo que R se divide por cuatro.","Si R=8 Ω y se duplica el diámetro sin variar L ni ρ, R=2 Ω.","Si A se triplica, ¿qué ocurre con R=12 Ω?","4 Ω.","Cable delgado → sección mayor → R menor"],["Cálculo real y temperatura","Para cobre a unos 20 °C, ρ≈1,68×10⁻⁸ Ω·m. Un cable de L=2 m y A=1 mm²=10⁻⁶ m² tiene R≈0,0336 Ω. El resultado depende de temperatura y pureza. No debe usarse R=ρL/A en componentes de geometría y comportamiento arbitrarios sin verificar supuestos.","Si ese mismo cable mide 10 m, R≈0,168 Ω.","Con ρ=2×10⁻⁸, L=5 m, A=2 mm², calcula R.","0,05 Ω.","ρ + L + A → R"]],figs=["\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 900 350\" role=\"img\">\u003crect x=\"0\" y=\"0\" width=\"900\" height=\"350\" rx=\"5\" fill=\"#FCFAF4\"/>\u003crect x=\"12\" y=\"12\" width=\"876\" height=\"226\" rx=\"5\" fill=\"#E4F1FE\"/>\u003cline x1=\"166\" y1=\"65\" x2=\"166\" y2=\"108\" stroke=\"#172D47\" stroke-width=\"3\" stroke-linecap=\"round\"/>\u003cline x1=\"166\" y1=\"142\" x2=\"166\" y2=\"185\" stroke=\"#172D47\" stroke-width=\"3\" stroke-linecap=\"round\"/>\u003cline x1=\"141\" y1=\"108\" x2=\"191\" y2=\"108\" stroke=\"#172D47\" stroke-width=\"3\" stroke-linecap=\"round\"/>\u003cline x1=\"153\" y1=\"142\" x2=\"179\" y2=\"142\" stroke=\"#172D47\" stroke-width=\"3\" stroke-linecap=\"round\"/>\u003ctext x=\"131\" y=\"107\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"20\" font-weight=\"700\" fill=\"#D64F61\">+\u003c/text>\u003ctext x=\"131\" y=\"147\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"20\" font-weight=\"700\" fill=\"#2475CA\">−\u003c/text>\u00
