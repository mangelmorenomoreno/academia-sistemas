<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Presentación · Potencia eléctrica y efecto Joule</title><style>*{box-sizing:border-box}body{margin:0;background:#fcfaf4;color:#172d47;font:17px/1.6 system-ui,sans-serif}header{background:#10243a;color:white;padding:16px 5%;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}header a{color:#7ddddd}main{max-width:1150px;margin:20px auto;display:grid;grid-template-columns:255px 1fr;gap:18px;padding:0 16px}aside,article{background:white;border:1px solid #dce5ec;border-radius:18px;padding:22px}aside{align-self:start;position:sticky;top:12px}aside a{display:block;color:#496579;text-decoration:none;font-size:14px;padding:6px 8px}aside a.active{background:#ddf6eb;font-weight:700}h1{font-size:clamp(27px,4vw,40px);line-height:1.15}h2{font-size:21px;color:#087f75}p{margin:8px 0 15px}img,svg{width:100%;height:auto;border-radius:12px}.nav{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:14px 0}button,.btn{padding:10px 13px;border-radius:9px;border:1px solid #087f75;background:#fff;color:#087f75;font:inherit;text-decoration:none;cursor:pointer}.primary{background:#087f75;color:white}button:disabled{opacity:.4}progress{width:100%;accent-color:#087f75}.example,.task,.explain{padding:13px 17px;border-radius:12px;background:#fff2d9;margin:14px 0}.task{background:#e4f1fe}.explain{background:#ddf6eb}.small{font-size:13px;color:#52677d}a{color:#087f75}footer{text-align:center;padding:20px;color:#52677d;font-size:13px}@media(max-width:760px){main{grid-template-columns:1fr}aside{position:static}aside nav{max-height:180px;overflow:auto}}@media print{aside,header,.nav,footer{display:none}main{display:block}article{border:0}}</style></head><body><header><strong>Academia Sistemas · Clase 008</strong><a href="../../../../index.html">Inicio</a></header><main style="display:block;max-width:1100px"><article><div class="nav"><button id="prev">← Anterior</button><span id="count"></span><button id="next" class="primary">Siguiente →</button></div><section id="page"></section><p><a href="libro.html">Volver al libro</a></p></article></main><footer>Del electrón al software · Modelos didácticos, no a escala</footer><script>const pages=[["Potencia: rapidez de transferencia","La potencia es energía transferida por unidad de tiempo: P=ΔE/Δt si se promedia. El vatio equivale a J/s. Dos aparatos pueden transferir la misma energía, pero uno hacerlo en menos tiempo y tener más potencia.","60 J en 10 s: P=6 W. Los mismos 60 J en 2 s: 30 W.","150 J en 30 s. Calcula P.","5 W.","Energía → tiempo → potencia"],["Potencia eléctrica","Para un elemento DC, P=VI con convención pasiva (corriente entrando al terminal positivo: potencia absorbida). Una fuente que entrega energía tiene potencia absorbida negativa. Si P constante, E=Pt. V·A=J/s.","5 V y 0,2 A: P=1 W; durante 60 s, E=60 J.","12 V y 0,5 A durante 10 s: P y E.","6 W; 60 J.","Voltaje × corriente → vatios"],["Efecto Joule","En un resistor óhmico, sustituir V=IR en P=VI da P=I²R=V²/R. La energía transferida aumenta la energía interna del material y puede salir como calor. La carga no desaparece; la fuente sostiene el campo.","0,1 A en 100 Ω: P=1 W. Si I se duplica con R fija, P=4 W.","0,02 A en 330 Ω. Calcula P.","0,132 W.","Corriente → resistor → calor"],["No confundir qué se mantiene fijo","Con corriente fija, aumentar R aumenta P=I²R. Con voltaje fijo, aumentar R reduce P=V²/R. Ambas expresiones son coherentes porque V, I y R están relacionadas. Siempre identifica qué variable controla la fuente.","A 3 V, 220 Ω disipa 40,9 mW y 1 kΩ disipa 9 mW.","A 6 V, compara P en 100 Ω y 200 Ω.","0,36 W y 0,18 W.","V fija: R ↑ → I ↓ → P ↓"],["Potencia nominal y margen","La potencia nominal indica cuánto puede disipar un componente bajo condiciones especificadas por fabricante; depende de temperatura, montaje y ventilación. Elegir un margen razonable no sustituye la hoja de datos. Un resistor de 0,25 W no debe operarse deliberadamente por encima de su capacidad.","5 V sobre 100 Ω: P=0,25 W; evitar usar un resistor de 0,25 W justo al límite; considerar 0,5 W o más según condiciones.","3 V sobre 330 Ω: P≈? ¿Un resistor de 0,25 W tendría margen ideal?","0,0273 W; sí, verificar especificaciones.","Calcula P → compara nominal → margen"],["Energía y consumo en sistemas","1 Wh=3600 J; 1 kWh=3,6 MJ. Un equipo de 20 W durante 3 h consume 60 Wh=216 kJ. La refrigeración retira energía térmica; no elimina la conservación. La potencia de un procesador depende de operación, tensión, frecuencia y pérdidas.","Una lámpara de 5 W durante 2 h consume 10 Wh=36.000 J.","Un equipo de 60 W durante 30 min consume ¿cuántos Wh?","30 Wh.","W × h → Wh → J"]],figs=["\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 900 350\" role=\"img\">\u003crect x=\"0\" y=\"0\" width=\"900\" height=\"350\" rx=\"5\" fill=\"#FCFAF4\"/>\u003crect x=\"12\" y=\"12\" width=\"876\" height=\"226\" rx=\"5\" fill=\"#E4F1FE\"/>\u003crect x=\"80\" y=\"80\" width=\"230\" height=\"90\" rx=\"5\" fill=\"#DDF6EB\"/>\u003crect x=\"590\" y=\"80\" width=\"230\" height=\"90\" rx=\"5\" fill=\"#FFF2D9\"/>\u003cline x1=\"325\" y1=\"125\" x2=\"575\" y2=\"125\" stroke=\"#087F75\" stroke-width=\"4\" stroke-linecap=\"round\"/>\u003cline x1=\"575\" y1=\"125\" x2=\"564.4690092573155\" y2=\"130.75310646325045\" stroke=\"#087F75\" stroke-width=\"4\" stroke-linecap=\"round\"/>\u003cline x1=\"575\" y1=\"125\" x2=\"564.4690092573155\" y2=\"119.24689353674957\" stroke=\"#087F75\" stroke-width=\"4\" stroke-linecap=\"round\"/>\u003ctext x=\"195\" y=\"115\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"19\" font-weight=\"700\" fill=\"#172D47\">Energía (J)\u003c/text>\u003ctext x=\"195\" y=\"146\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"19\" font-weight=\"700\" fill=\"#172D47\">Tiempo (s)\u003c/text>\u003ctext x=\"705\" y=\"115\" text-anchor=\"m
