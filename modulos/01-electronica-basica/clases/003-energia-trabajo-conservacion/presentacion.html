<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Presentación · Energía, trabajo y conservación de la energía</title><style>*{box-sizing:border-box}body{margin:0;background:#fcfaf4;color:#172d47;font:17px/1.6 system-ui,sans-serif}header{background:#10243a;color:white;padding:16px 5%;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}header a{color:#7ddddd}main{max-width:1150px;margin:20px auto;display:grid;grid-template-columns:255px 1fr;gap:18px;padding:0 16px}aside,article{background:white;border:1px solid #dce5ec;border-radius:18px;padding:22px}aside{align-self:start;position:sticky;top:12px}aside a{display:block;color:#496579;text-decoration:none;font-size:14px;padding:6px 8px}aside a.active{background:#ddf6eb;font-weight:700}h1{font-size:clamp(27px,4vw,40px);line-height:1.15}h2{font-size:21px;color:#087f75}p{margin:8px 0 15px}img,svg{width:100%;height:auto;border-radius:12px}.nav{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:14px 0}button,.btn{padding:10px 13px;border-radius:9px;border:1px solid #087f75;background:#fff;color:#087f75;font:inherit;text-decoration:none;cursor:pointer}.primary{background:#087f75;color:white}button:disabled{opacity:.4}progress{width:100%;accent-color:#087f75}.example,.task,.explain{padding:13px 17px;border-radius:12px;background:#fff2d9;margin:14px 0}.task{background:#e4f1fe}.explain{background:#ddf6eb}.small{font-size:13px;color:#52677d}a{color:#087f75}footer{text-align:center;padding:20px;color:#52677d;font-size:13px}@media(max-width:760px){main{grid-template-columns:1fr}aside{position:static}aside nav{max-height:180px;overflow:auto}}@media print{aside,header,.nav,footer{display:none}main{display:block}article{border:0}}</style></head><body><header><strong>Academia Sistemas · Clase 003</strong><a href="../../../../index.html">Inicio</a></header><main style="display:block;max-width:1100px"><article><div class="nav"><button id="prev">← Anterior</button><span id="count"></span><button id="next" class="primary">Siguiente →</button></div><section id="page"></section><p><a href="libro.html">Volver al libro</a></p></article></main><footer>Del electrón al software · Modelos didácticos, no a escala</footer><script>const pages=[["Energía: capacidad de producir cambios","La energía es una magnitud física que permite cuantificar cambios y transferencias. Un cuerpo en movimiento posee energía cinética; una pila almacena energía química; un objeto elevado tiene energía potencial gravitatoria respecto a una referencia. No es una sustancia ni una carga eléctrica. Su unidad SI es el julio (J).","Una pelota de 2 kg que viaja a 3 m/s tiene Ec=½mv²=9 J.","Una pelota de 4 kg viaja a 2 m/s. ¿Cuál es Ec?","8 J; ½×4×2².","Pelota quieta → movimiento → cambio"],["Trabajo: cómo una fuerza transfiere energía","Para una fuerza constante, W=Fd cos θ. F es magnitud en N, d desplazamiento en m y θ el ángulo entre ambos. Si empujas a favor del desplazamiento, el trabajo es positivo; en contra, negativo; perpendicular, cero. Una fuerza sin desplazamiento no realiza trabajo mecánico sobre ese cuerpo.","5 N durante 3 m en la misma dirección: W=15 J. Si la fuerza se opone, W=−15 J.","Una fuerza de 10 N desplaza 2 m perpendicularmente. ¿Qué trabajo hace?","0 J; cos 90°=0.","Fuerza → desplazamiento → trabajo"],["Energía potencial y referencia","La energía potencial describe una configuración de un sistema. Cerca de la superficie terrestre, ΔUg=mgΔh. Elevar una masa requiere transferir energía; al caer puede aumentar su energía cinética. El valor absoluto depende de la referencia, pero los cambios son físicos. En electricidad aparecerá una relación semejante entre carga y potencial.","1 kg elevado 2 m: ΔUg≈19,6 J con g=9,8 m/s².","Eleva 2 kg 3 m. Calcula ΔUg.","58,8 J.","Altura inicial → trabajo externo → altura final"],["Ley de conservación: sistema y entorno","La energía total de un sistema aislado permanece constante. En un sistema que intercambia energía, ΔE=Eentrante−Esaliente. Hay que definir la frontera: si una batería y una lámpara están dentro, la energía química disminuye y aumenta o sale energía térmica y luminosa. El calor no es energía destruida, sino una vía de transferencia por diferencia de temperatura.","Una fuente entrega 100 J; salen 25 J como luz y 75 J como calor en un modelo ideal sin almacenamiento. Balance: 100=25+75.","Llegan 60 J, salen 15 J de luz y 35 J de calor. ¿Cuánto aumenta la energía almacenada?","10 J, si no hay otras transferencias.","Fuente 100 J → luz 25 J + calor 75 J"],["Eficiencia y transformación","La eficiencia se define como energía útil dividida por energía de entrada, multiplicada por 100%. Qué es útil depende del objetivo: el calor es útil en una calefacción, pero normalmente no en un LED. Una eficiencia menor que 100% no viola la conservación.","Un dispositivo recibe 200 J y entrega 80 J útiles: η=40%; 120 J se transfieren a otras formas o al entorno.","Si un motor recibe 500 J y entrega 350 J mecánicos, calcula η.","70%; los otros 150 J deben contabilizarse.","Entrada → energía útil + otras transferencias"],["De la pila al computador","La reacción química de una batería sostiene una diferencia de potencial. Al cerrar un circuito, el campo electromagnético permite transferir energía a los componentes; la carga se conserva. Un procesador convierte energía eléctrica principalmente en calor y en operaciones físicas de conmutación; la información no es una forma de energía que sustituya el balance.","Un circuito recibe 12 J y libera 10 J al entorno; 2 J quedan almacenados temporalmente.","¿Por qué apagar un equipo no significa destruir su energía?","Deja de recibir energía; la almacenada se transforma o se transfiere.","Química → eléctrica → luz/calor"]],figs=["\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 900 350\" role=\"img\">\u003crect x=\"0\" y=\"0\" width=\"900\" height=\"350\" rx=\"5\" fill=\"#FCF
