<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Presentación · Academia Sistemas</title><style>body{margin:0;background:#10243a;color:#e8f2ff;font:clamp(16px,2vw,25px)/1.4 system-ui}main{max-width:1120px;margin:auto;padding:3vw}h1{font-size:clamp(25px,4vw,48px);margin:.4em 0}h2{font-size:1.15em;color:#35d0bc}img{display:block;width:100%;max-height:47vh;object-fit:contain}button,a{font:inherit;background:#1a3651;color:white;border:1px solid #35d0bc;padding:.4em .8em;border-radius:7px;text-decoration:none;cursor:pointer}button:disabled{opacity:.4}nav{display:flex;gap:10px;flex-wrap:wrap;align-items:center}small{color:#b9d4e7}</style><main><small>ACADEMIA SISTEMAS / CLASE 001</small><h1 id="title"></h1><h2 id="sub"></h2><img id="figure" alt="Diagrama explicativo"><p id="body"></p><nav><button id="prev">← Anterior</button><span id="count"></span><button id="next">Siguiente →</button><a href="../../../../index.html#biblioteca" id="library">Descargas</a><a href="libro.html" id="reader">Volver al libro</a></nav></main><script>const slides=[{"id":"01","title":"De un cable al átomo","sub":"1. Objeto","body":"Un cable real contiene un núcleo metálico y una cubierta aislante. Ambos son materia: tienen masa y ocupan espacio.","fig":"https://raw.githubusercontent.com/mangelmorenomoreno/academia-sistemas/main/modulos/01-electronica-basica/clases/001-materia-atomos-electrones/recursos/ilustraciones/01-matter.svg"},{"id":"01","title":"De un cable al átomo","sub":"2. Material","body":"Al ampliar el cobre aparecen átomos organizados en una red. No todo material está hecho de moléculas independientes.","fig":"https://raw.githubusercontent.com/mangelmorenomoreno/academia-sistemas/main/modulos/01-electronica-basica/clases/001-materia-atomos-electrones/recursos/ilustraciones/01-matter.svg"},{"id":"01","title":"De un cable al átomo","sub":"3. Átomo","body":"Un átomo de cobre tiene 29 protones. El número de protones define el elemento; los electrones permiten muchas de sus interacciones.","fig":"https://raw.githubusercontent.com/mangelmorenomoreno/academia-sistemas/main/modulos/01-electronica-basica/clases/001-materia-atomos-electrones/recursos/ilustraciones/01-matter.svg"},{"id":"02","title":"Dentro del átomo","sub":"1. Núcleo","body":"Contiene protones de carga +e y, normalmente, neutrones de carga cero. El hidrógeno-1 es una excepción: su núcleo solo tiene un protón.","fig":"https://raw.githubusercontent.com/mangelmorenomoreno/academia-sistemas/main/modulos/01-electronica-basica/clases/001-materia-atomos-electrones/recursos/ilustraciones/02-atom.svg"},{"id":"02","title":"Dentro del átomo","sub":"2. Región electrónica","body":"Los electrones tienen carga −e y se describen mediante estados cuánticos. Los dibujos de capas representan regiones, no trayectorias reales.","fig":"https://raw.githubusercontent.com/mangelmorenomoreno/academia-sistemas/main/modulos/01-electronica-basica/clases/001-materia-atomos-electrones/recursos/ilustraciones/02-atom.svg"},{"id":"02","title":"Dentro del átomo","sub":"3. Ejemplo: litio-7","body":"Tiene 3 protones, 4 neutrones y, si es neutro, 3 electrones. Los protones y neutrones concentran casi toda la masa.","fig":"https://raw.githubusercontent.com/mangelmorenomoreno/academia-sistemas/main/modulos/01-electronica-basica/clases/001-materia-atomos-electrones/recursos/ilustraciones/02-atom.svg"},{"id":"03","title":"¿Qué mantiene unido al electrón?","sub":"1. Atracción","body":"El núcleo positivo atrae a los electrones negativos mediante la interacción electromagnética. Los electrones también se repelen entre sí.","fig":"https://raw.githubusercontent.com/mangelmorenomoreno/academia-sistemas/main/modulos/01-electronica-basica/clases/001-materia-atomos-electrones/recursos/ilustraciones/03-binding.svg"},{"id":"03","title":"¿Qué mantiene unido al electrón?","sub":"2. Apantallamiento","body":"En átomos con varios electrones, los internos reducen en parte la atracción efectiva sobre los externos. Algunos electrones de valencia están menos ligados; en sólidos importan también los enlaces y estados electrónicos.","fig":"https://raw.githubusercontent.com/mangelmorenomoreno/academia-sistemas/main/modulos/01-electronica-basica/clases/001-materia-atomos-electrones/recursos/ilustraciones/03-binding.svg"},{"id":"03","title":"¿Qué mantiene unido al electrón?","sub":"3. Aporte de energía","body":"Un electrón no sale porque sí. Una interacción con otro material, radiación, calor o un campo suficientemente intenso puede permitir que cambie de estado o se transfiera. Arrancarlo de un átomo aislado requiere energía de ionización.","fig":"https://raw.githubusercontent.com/mangelmorenomoreno/academia-sistemas/main/modulos/01-electronica-basica/clases/001-materia-atomos-electrones/recursos/ilustraciones/03-binding.svg"},{"id":"04","title":"¿Por qué no se mueve un protón o un neutrón?","sub":"1. Electrón","body":"Está ligado electromagnéticamente fuera del núcleo. En la electrización ordinaria de sólidos pueden redistribuirse algunos electrones, sin alterar los núcleos.","fig":"https://raw.githubusercontent.com/mangelmorenomoreno/academia-sistemas/main/modulos/01-electronica-basica/clases/001-materia-atomos-electrones/recursos/ilustraciones/04-nuclear.svg"},{"id":"04","title":"¿Por qué no se mueve un protón o un neutrón?","sub":"2. Protón","body":"Está en el núcleo, ligado por interacciones nucleares. Cambiar el número de protones cambia el elemento: carbono tiene 6 y nitrógeno 7. Separar un protón es un proceso nuclear, no de frotamiento.","fig":"https://raw.githubusercontent.com/mangelmorenomoreno/academia-sistemas/main/modulos/01-electronica-basica/clases/001-materia-atomos-electrones/recursos/ilustraciones/04-nuclear.svg"},{"id":"04","title":"¿Por qué no se mueve un protón o un neutrón?","sub":"3. Neutrón","body":"También está ligado en el núcleo y no tiene carga neta. Perder un neutrón cambia el isótopo, no la carga neta por sí solo. Un neutrón no contiene un electrón que se desprenda al frotar.","fig":"https://raw.githubusercontent.com/mangelmorenomoreno/academia-sistemas/main/modulos/01-electronica-basica/clases/001-materia-atomos-electrones/recursos/ilustraciones/04-nuclear.svg"},{"id":"05","title":"Carga neutra, positiva y negativa","sub":"1. Neutra","body":"Las cargas se compensan. Un modelo con 4 cargas positivas y 4 negativas tiene carga neta cero, aunque contiene partículas cargadas.","fig":"https://raw.githubusercontent.com/mangelmorenomoreno/academia-sistemas/main/modulos/01-electronica-basica/clases/001-materia-atomos-electrones/recursos/ilustraciones/05-balance.svg"},{"id":"05","title":"Carga neutra, positiva y negativa","sub":"2. Positiva","body":"Si ese modelo pierde un electrón, quedan 4 positivas y 3 negativas. Hay déficit de electrones; no aparecen protones nuevos.","fig":"https://raw.githubusercontent.com/mangelmorenomoreno/academia-sistemas/main/modulos/01-electronica-basica/clases/001-materia-atomos-electrones/recursos/ilustraciones/05-balance.svg"},{"id":"05","title":"Carga neutra, positiva y negativa","sub":"3. Negativa","body":"Si el modelo neutro gana un electrón, quedan 4 positivas y 5 negativas. Hay exceso de electrones. El electrón proviene de otro sistema.","fig":"https://raw.githubusercontent.com/mangelmorenomoreno/academia-sistemas/main/modulos/01-electronica-basica/clases/001-materia-atomos-electrones/recursos/ilustraciones/05-balance.svg"},{"id":"06","title":"Transferencia y conservación","sub":"1. Antes","body":"A y B empiezan neutros: 3 positivas y 3 negativas en cada uno. La suma de sus cargas es cero.","fig":"https://raw.githubusercontent.com/mangelmorenomoreno/academia-sistemas/main/modulos/01-electronica-basica/clases/001-materia-atomos-electrones/recursos/ilustraciones/06-transfer.svg"},{"id":"06","title":"Transferencia y conservación","sub":"2. Durante","body":"Una interacción permite que un electrón salga de A y vaya hacia B. Mientras está en tránsito, debe contarse también su carga −e.","fig":"https://raw.githubusercontent.com/mangelmorenomoreno/academia-sistemas/main/modulos/01-electronica-basica/clases/001-materia-atomos-electrones/recursos/ilustraciones/06-transfer.svg"},{"id":"06","title":"Transferencia y conservación","sub":"3. Después","body":"A conserva 3 positivas y 2 negativas: +e. B queda con 3 positivas y 4 negativas: −e. El sistema completo sigue teniendo carga neta cero.","fig":"https://raw.githubusercontent.com/mangelmorenomoreno/academia-sistemas/main/modulos/01-electronica-basica/clases/001-materia-atomos-electrones/recursos/ilustraciones/06-transfer.svg"},{"id":"07","title":"Atracción y repulsión","sub":"1. Iguales positivas","body":"Dos cargas + se repelen. Las fuerzas sobre cada una tienen sentidos opuestos.","fig":"https://raw.githubusercontent.com/mangelmorenomoreno/academia-sistemas/main/modulos/01-electronica-basica/clases/001-materia-atomos-electrones/recursos/ilustraciones/07-force.svg"},{"id":"07","title":"Atracción y repulsión","sub":"2. Iguales negativas","body":"Dos cargas − también se repelen. Negativo no significa que no exista fuerza.","fig":"https://raw.githubusercontent.com/mangelmorenomoreno/academia-sistemas/main/modulos/01-electronica-basica/clases/001-materia-atomos-electrones/recursos/ilustraciones/07-force.svg"},{"id":"07","title":"Atracción y repulsión","sub":"3. Opuestas","body":"Una carga + y otra − se atraen. Para cargas puntuales en el vacío, F = k|q₁q₂|/r²: al duplicar la distancia, la magnitud queda en un cuarto.","fig":"https://raw.githubusercontent.com/mangelmorenomoreno/academia-sistemas/main/modulos/01-electronica-basica/clases/001-materia-atomos-electrones/recursos/ilustraciones/07-force.svg"},{"id":"08","title":"Electrización por frotamiento","sub":"1. Antes","body":"Globo y tela pueden estar inicialmente neutros. Sus materiales tienen distintos estados y afinidades para las cargas en sus superficies.","fig":"https://raw.githubusercontent.com/mangelmorenomoreno/academia-sistemas/main/modulos/01-electronica-basica/clases/001-materia-atomos-electrones/recursos/ilustraciones/08-friction.svg"},{"id":"08","title":"Electrización por frotamiento","sub":"2. Contacto repetido","body":"Frotar aumenta los contactos y separaciones microscópicas; algunos electrones pueden quedar en el otro material. El trabajo mecánico facilita separar las cargas. El mecanismo detallado depende de la superficie.","fig":"https://raw.githubusercontent.com/mangelmorenomoreno/academia-sistemas/main/modulos/01-electronica-basica/clases/001-materia-atomos-electrones/recursos/ilustraciones/08-friction.svg"},{"id":"08","title":"Electrización por frotamiento","sub":"3. Separación","body":"En un caso típico, electrones pasan de una tela al globo: tela positiva, globo negativo. No siempre se obtiene el mismo signo; depende de materiales, humedad y condiciones.","fig":"https://raw.githubusercontent.com/mangelmorenomoreno/academia-sistemas/main/modulos/01-electronica-basica/clases/001-materia-atomos-electrones/recursos/ilustraciones/08-friction.svg"},{"id":"09","title":"Electrización por contacto","sub":"1. Separados","body":"Dos conductores pueden tener diferente potencial eléctrico. Supón esferas idénticas, aisladas, con −4e y 0.","fig":"https://raw.githubusercontent.com/mangelmorenomoreno/academia-sistemas/main/modulos/01-electronica-basica/clases/001-materia-atomos-electrones/recursos/ilustraciones/09-contact.svg"},{"id":"09","title":"Electrización por contacto","sub":"2. Contacto","body":"Al unirlos, los electrones móviles se redistribuyen por el campo eléctrico hasta el equilibrio electrostático. No se transfieren protones entre los sólidos.","fig":"https://raw.githubusercontent.com/mangelmorenomoreno/academia-sistemas/main/modulos/01-electronica-basica/clases/001-materia-atomos-electrones/recursos/ilustraciones/09-contact.svg"},{"id":"09","title":"Electrización por contacto","sub":"3. Equilibrio","body":"Al separarlas, el modelo ideal da −2e en cada esfera. El reparto igual requiere simetría; no es una regla universal para cualquier geometría.","fig":"https://raw.githubusercontent.com/mangelmorenomoreno/academia-sistemas/main/modulos/01-electronica-basica/clases/001-materia-atomos-electrones/recursos/ilustraciones/09-contact.svg"},{"id":"10","title":"Polarización: atraer sin tocar","sub":"1. Papel neutro","body":"El papel contiene cargas positivas y negativas compensadas. Muchas cargas están ligadas en moléculas.","fig":"https://raw.githubusercontent.com/mangelmorenomoreno/academia-sistemas/main/modulos/01-electronica-basica/clases/001-materia-atomos-electrones/recursos/ilustraciones/10-polar.svg"},{"id":"10","title":"Polarización: atraer sin tocar","sub":"2. Globo cercano","body":"El campo de un globo negativo desplaza ligeramente la distribución electrónica dentro del papel o reorienta dipolos. El lado próximo presenta carga positiva relativa.","fig":"https://raw.githubusercontent.com/mangelmorenomoreno/academia-sistemas/main/modulos/01-electronica-basica/clases/001-materia-atomos-electrones/recursos/ilustraciones/10-polar.svg"},{"id":"10","title":"Polarización: atraer sin tocar","sub":"3. Atracción","body":"La atracción de las cargas opuestas más cercanas puede superar la repulsión de las negativas más alejadas. La carga neta del papel puede seguir siendo cero; no necesita recibir electrones del globo.","fig":"https://raw.githubusercontent.com/mangelmorenomoreno/academia-sistemas/main/modulos/01-electronica-basica/clases/001-materia-atomos-electrones/recursos/ilustraciones/10-polar.svg"},{"id":"11","title":"Inducción con conexión a tierra","sub":"1. Acercar","body":"Una varilla negativa cerca de un conductor neutro redistribuye sus electrones. Aún no cambia su carga total.","fig":"https://raw.githubusercontent.com/mangelmorenomoreno/academia-sistemas/main/modulos/01-electronica-basica/clases/001-materia-atomos-electrones/recursos/ilustraciones/11-induction.svg"},{"id":"11","title":"Inducción con conexión a tierra","sub":"2. Conectar a tierra","body":"En un modelo electrostático, la repulsión permite que salgan electrones hacia tierra. La Tierra actúa como reservorio de carga.","fig":"https://raw.githubusercontent.com/mangelmorenomoreno/academia-sistemas/main/modulos/01-electronica-basica/clases/001-materia-atomos-electrones/recursos/ilustraciones/11-induction.svg"},{"id":"11","title":"Inducción con conexión a tierra","sub":"3. Desconectar y retirar","body":"Primero se retira la conexión a tierra y luego la varilla. El conductor queda con déficit de electrones. El balance se conserva al incluir la Tierra.","fig":"https://raw.githubusercontent.com/mangelmorenomoreno/academia-sistemas/main/modulos/01-electronica-basica/clases/001-materia-atomos-electrones/recursos/ilustraciones/11-induction.svg"},{"id":"12","title":"Conductores, aislantes y semiconductores","sub":"1. Conductor","body":"En cobre y otros metales existen estados electrónicos que permiten transportar carga; los iones de la red no recorren el cable.","fig":"https://raw.githubusercontent.com/mangelmorenomoreno/academia-sistemas/main/modulos/01-electronica-basica/clases/001-materia-atomos-electrones/recursos/ilustraciones/12-materials.svg"},{"id":"12","title":"Conductores, aislantes y semiconductores","sub":"2. Aislante","body":"En plástico o vidrio las cargas están mucho menos disponibles para el transporte en condiciones ordinarias. Pueden polarizarse o acumular carga localizada.","fig":"https://raw.githubusercontent.com/mangelmorenomoreno/academia-sistemas/main/modulos/01-electronica-basica/clases/001-materia-atomos-electrones/recursos/ilustraciones/12-materials.svg"},{"id":"12","title":"Conductores, aislantes y semiconductores","sub":"3. Semiconductor","body":"En silicio la población y movilidad de portadores pueden controlarse mediante dopaje, temperatura, luz o campos. Eso permite dispositivos electrónicos.","fig":"https://raw.githubusercontent.com/mangelmorenomoreno/academia-sistemas/main/modulos/01-electronica-basica/clases/001-materia-atomos-electrones/recursos/ilustraciones/12-materials.svg"},{"id":"13","title":"Corriente eléctrica y batería","sub":"1. Campo eléctrico","body":"En un metal sin campo aplicado, el movimiento microscópico no tiene deriva neta. Una batería mantiene diferencia de potencial mediante procesos químicos.","fig":"https://raw.githubusercontent.com/mangelmorenomoreno/academia-sistemas/main/modulos/01-electronica-basica/clases/001-materia-atomos-electrones/recursos/ilustraciones/13-current.svg"},{"id":"13","title":"Corriente eléctrica y batería","sub":"2. Circuito cerrado","body":"El campo eléctrico se establece en el circuito y los electrones adquieren deriva promedio. En el tramo superior del ejemplo salen convencionalmente del + hacia la resistencia; los electrones derivan en sentido contrario.","fig":"https://raw.githubusercontent.com/mangelmorenomoreno/academia-sistemas/main/modulos/01-electronica-basica/clases/001-materia-atomos-electrones/recursos/ilustraciones/13-current.svg"},{"id":"13","title":"Corriente eléctrica y batería","sub":"3. Circuito abierto","body":"Sin camino cerrado no hay corriente sostenida. La corriente I = ΔQ/Δt mide carga que cruza una sección por tiempo. 1 A = 1 C/s. La resistencia transfiere energía, no consume electrones.","fig":"https://raw.githubusercontent.com/mangelmorenomoreno/academia-sistemas/main/modulos/01-electronica-basica/clases/001-materia-atomos-electrones/recursos/ilustraciones/13-current.svg"},{"id":"14","title":"Del electrón al software","sub":"1. Transistor","body":"El control del transporte de carga en materiales semiconductores permite fabricar transistores, componentes capaces de controlar señales.","fig":"https://raw.githubusercontent.com/mangelmorenomoreno/academia-sistemas/main/modulos/01-electronica-basica/clases/001-materia-atomos-electrones/recursos/ilustraciones/14-software.svg"},{"id":"14","title":"Del electrón al software","sub":"2. Lógica y procesador","body":"Combinaciones de transistores forman compuertas. Los circuitos digitales interpretan rangos de señal como 0 y 1. Registros, ALU y memoria permiten procesar y almacenar datos.","fig":"https://raw.githubusercontent.com/mangelmorenomoreno/academia-sistemas/main/modulos/01-electronica-basica/clases/001-materia-atomos-electrones/recursos/ilustraciones/14-software.svg"},{"id":"14","title":"Del electrón al software","sub":"3. Programa","body":"El software expresa instrucciones y algoritmos. Según el lenguaje y entorno, estos se traducen o interpretan y terminan siendo ejecutados por hardware. Un bit no es un electrón individual.","fig":"https://raw.githubusercontent.com/mangelmorenomoreno/academia-sistemas/main/modulos/01-electronica-basica/clases/001-materia-atomos-electrones/recursos/ilustraciones/14-software.svg"},{"id":"15","title":"Laboratorio guiado: globo y fichas","sub":"1. Fichas","body":"Usa dos hojas A y B con 6 fichas rojas y 6 azules en cada una. Mueve una azul de A a B, luego dos más y devuelve dos. Registra cantidades y cargas en cada paso.","fig":"https://raw.githubusercontent.com/mangelmorenomoreno/academia-sistemas/main/modulos/01-electronica-basica/clases/001-materia-atomos-electrones/recursos/ilustraciones/15-lab.svg"},{"id":"15","title":"Laboratorio guiado: globo y fichas","sub":"2. Globo y papel","body":"Materiales: globo, tela seca, trozos de papel y regla. Acerca sin frotar y registra; frota 10 segundos; acerca a distancia comparable; repite tres veces.","fig":"https://raw.githubusercontent.com/mangelmorenomoreno/academia-sistemas/main/modulos/01-electronica-basica/clases/001-materia-atomos-electrones/recursos/ilustraciones/15-lab.svg"},{"id":"15","title":"Laboratorio guiado: globo y fichas","sub":"3. Simulación","body":"Abre PhET Globos y electricidad estática. Muestra todas las cargas, frota el globo contra el jersey y acércalo a la pared. Dibuja antes y después; observa polarización.","fig":"https://raw.githubusercontent.com/mangelmorenomoreno/academia-sistemas/main/modulos/01-electronica-basica/clases/001-materia-atomos-electrones/recursos/ilustraciones/15-lab.svg"},{"id":"16","title":"Ejercicios: razonar paso a paso","sub":"1. Balance","body":"A: 12p y 10e. B: 9p y 10e. Calcula Q/e. Un objeto con −7e pierde 4 electrones: ¿qué carga conserva?","fig":"https://raw.githubusercontent.com/mangelmorenomoreno/academia-sistemas/main/modulos/01-electronica-basica/clases/001-materia-atomos-electrones/recursos/ilustraciones/16-exercise.svg"},{"id":"16","title":"Ejercicios: razonar paso a paso","sub":"2. Transferencia","body":"A y B neutros: A entrega cinco electrones y B devuelve dos. Dibuja antes, durante y después, y calcula la suma. Dos esferas iguales con +6e y −2e se conectan: calcula reparto ideal.","fig":"https://raw.githubusercontent.com/mangelmorenomoreno/academia-sistemas/main/modulos/01-electronica-basica/clases/001-materia-atomos-electrones/recursos/ilustraciones/16-exercise.svg"},{"id":"16","title":"Ejercicios: razonar paso a paso","sub":"3. Interpretación","body":"Explica por qué la fricción no crea electrones; por qué un papel neutro es atraído; qué diferencia un aislante de un conductor; qué sentido tienen corriente y electrones en un mismo tramo.","fig":"https://raw.githubusercontent.com/mangelmorenomoreno/academia-sistemas/main/modulos/01-electronica-basica/clases/001-materia-atomos-electrones/recursos/ilustraciones/16-exercise.svg"},{"id":"17","title":"Evaluación y sustentación","sub":"1. Parte A · 40 puntos","body":"1) Define átomo y elemento (8). 2) Identifica cargas y ubicación de las partículas (8). 3) Calcula Q/e en 8p/8e, 11p/10e, 17p/18e y 6p/4e (8). 4) Justifica por qué sale un electrón y no un neutrón (8). 5) Dibuja fuerzas y efecto de duplicar distancia (8).","fig":"https://raw.githubusercontent.com/mangelmorenomoreno/academia-sistemas/main/modulos/01-electronica-basica/clases/001-materia-atomos-electrones/recursos/ilustraciones/17-exam.svg"},{"id":"17","title":"Evaluación y sustentación","sub":"2. Parte B · 60 puntos","body":"6) A y B neutros; A cede 4e: balance (15). 7) Compara frotamiento, contacto y polarización (15). 8) Clasifica materiales con ejemplos (10). 9) Dibuja circuito y sentidos (10). 10) Explica la relación con CPU y software (10).","fig":"https://raw.githubusercontent.com/mangelmorenomoreno/academia-sistemas/main/modulos/01-electronica-basica/clases/001-materia-atomos-electrones/recursos/ilustraciones/17-exam.svg"},{"id":"17","title":"Evaluación y sustentación","sub":"3. Sustentación","body":"Sin leer, explica qué energía permite transferir electrones, qué cambia al perder un protón o neutrón, y por qué la carga se conserva. Meta: 80/100 y dominio de estos conceptos.","fig":"https://raw.githubusercontent.com/mangelmorenomoreno/academia-sistemas/main/modulos/01-electronica-basica/clases/001-materia-atomos-electrones/recursos/ilustraciones/17-exam.svg"}];let i=0;function go(n){i=Math.max(0,Math.min(slides.length-1,n));let s=slides[i];['title','sub','body'].forEach(k=>document.getElementById(k).textContent=s[k]);document.getElementById('figure').src=location.protocol==='file:'?s.fig:s.fig.replace("https://raw.githubusercontent.com/mangelmorenomoreno/academia-sistemas/main/modulos/01-electronica-basica/clases/001-materia-atomos-electrones/",'');document.getElementById('count').textContent=(i+1)+' / '+slides.length;document.getElementById('prev').disabled=i===0;document.getElementById('next').disabled=i===slides.length-1}document.getElementById('prev').onclick=()=>go(i-1);document.getElementById('next').onclick=()=>go(i+1);document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(i-1);if(e.key==='ArrowRight')go(i+1)});if(location.protocol==='file:'){document.getElementById('library')?.setAttribute('href',"https://github.com/mangelmorenomoreno/academia-sistemas/blob/main/modulos/01-electronica-basica/clases/001-materia-atomos-electrones/descargas.md");document.getElementById('reader')?.setAttribute('href',"https://github.com/mangelmorenomoreno/academia-
