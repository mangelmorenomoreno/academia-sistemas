<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Presentación · Diodos y LED</title><style>*{box-sizing:border-box}body{margin:0;background:#fcfaf4;color:#172d47;font:17px/1.6 system-ui,sans-serif}header{background:#10243a;color:white;padding:16px 5%;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}header a{color:#7ddddd}main{max-width:1150px;margin:20px auto;display:grid;grid-template-columns:255px 1fr;gap:18px;padding:0 16px}aside,article{background:white;border:1px solid #dce5ec;border-radius:18px;padding:22px}aside{align-self:start;position:sticky;top:12px}aside a{display:block;color:#496579;text-decoration:none;font-size:14px;padding:6px 8px}aside a.active{background:#ddf6eb;font-weight:700}h1{font-size:clamp(27px,4vw,40px);line-height:1.15}h2{font-size:21px;color:#087f75}p{margin:8px 0 15px}img,svg{width:100%;height:auto;border-radius:12px}.nav{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:14px 0}button,.btn{padding:10px 13px;border-radius:9px;border:1px solid #087f75;background:#fff;color:#087f75;font:inherit;text-decoration:none;cursor:pointer}.primary{background:#087f75;color:white}button:disabled{opacity:.4}progress{width:100%;accent-color:#087f75}.example,.task,.explain{padding:13px 17px;border-radius:12px;background:#fff2d9;margin:14px 0}.task{background:#e4f1fe}.explain{background:#ddf6eb}.small{font-size:13px;color:#52677d}a{color:#087f75}footer{text-align:center;padding:20px;color:#52677d;font-size:13px}@media(max-width:760px){main{grid-template-columns:1fr}aside{position:static}aside nav{max-height:180px;overflow:auto}}@media print{aside,header,.nav,footer{display:none}main{display:block}article{border:0}}</style></head><body><header><strong>Academia Sistemas · Clase 022</strong><a href="../../../../index.html">Inicio</a></header><main style="display:block;max-width:1100px"><article><div class="nav"><button id="prev">← Anterior</button><span id="count"></span><button id="next" class="primary">Siguiente →</button></div><section id="page"></section><p><a href="libro.html">Volver al libro</a></p></article></main><footer>Del electrón al software · Modelos didácticos, no a escala</footer><script>const pages=[["Semiconductor y unión PN","Un semiconductor como silicio permite controlar portadores. Dopaje tipo n aumenta electrones disponibles; tipo p crea huecos (estados que se comportan como portadores positivos). Al unir regiones aparece una zona de agotamiento y un campo interno. Los materiales siguen aproximadamente neutros fuera de esa región.","Un diodo PN tiene ánodo y cátodo; no es simplemente un resistor polarizado.","¿Un hueco es un protón moviéndose por el silicio?","No; describe ausencia electrónica efectiva con carga positiva.","Región p | agotamiento | región n"],["Polarización directa e inversa","En directa, ánodo a potencial mayor que cátodo, se reduce la barrera y la corriente aumenta de forma no lineal. En inversa, la corriente suele ser pequeña hasta ruptura, que puede dañar un diodo no diseñado para ello. No hay un umbral universal exacto; depende de dispositivo, corriente y temperatura.","Un diodo de silicio puede tener caída aproximada 0,6–0,8 V en ciertas condiciones, no valor fijo universal.","¿Un diodo en inversa es siempre un aislante perfecto?","No; tiene fuga y puede entrar en ruptura.","Directa → barrera menor | inversa → barrera mayor"],["LED y recombinación","Un LED emite fotones cuando electrones y huecos se recombinan en un semiconductor adecuado. La energía de fotón está relacionada con la brecha energética y la frecuencia: E=hf. Parte de la energía se transforma en calor. El color depende del material y diseño, no solo del voltaje aplicado.","Un LED rojo y uno azul pueden tener caídas directas diferentes al mismo nivel de corriente.","¿La energía de la luz aparece de la nada?","No; procede de la energía eléctrica transferida.","Electrón + hueco → fotón + calor"],["Por qué limitar corriente","La relación I-V del LED es muy no lineal; un pequeño aumento de tensión puede elevar mucho la corriente. Un resistor en serie reduce sensibilidad y limita corriente. Para aproximación DC, R=(Vs−Vf)/Iobjetivo, con Vs>Vf y Vf tomado de datos a corriente prevista. Comprueba potencia y tolerancias.","5 V, LED rojo Vf≈2 V, I=10 mA: R≈300 Ω. Elegir 330 Ω da ≈9,1 mA.","3 V, Vf≈1,8 V, objetivo 5 mA. ¿R?","240 Ω; comprobar hoja de datos y potencia.","Fuente → resistor → LED → retorno"],["Potencia y polaridad","P_R≈I²R y P_LED≈VfI. En ejemplo 5 V, 330 Ω y Vf≈2 V: I≈9,09 mA, P_R≈27,3 mW, P_LED≈18,2 mW; total≈45,5 mW. La barra del símbolo es cátodo; el encapsulado puede tener pata corta o marca, pero verifica hoja de datos.","Invertir LED puede impedir luz y exceder tensión inversa permitida si se aplica fuente inadecuada.","¿La potencia eléctrica del LED se convierte toda en luz?","No; también hay calor y pérdidas.","Potencia fuente → resistor + LED"],["Montaje y diagnóstico","Usa fuente limitada de 3–5 V, resistor calculado, LED con datos conocidos y supervisión. Conecta sin energía, comprueba polaridad, revisa que no haya puentes y mide V en paralelo. No uses baterías de alta corriente sin limitación. Si no enciende, desconecta y revisa circuito, polaridad y valores.","Con 3 V y LED rojo Vf≈2 V, 330 Ω da ≈3 mA; brillo depende del LED.","¿Qué revisar primero si el LED no enciende?","Desenergizar e inspeccionar conexiones, polaridad, fuente y valor; no eliminar resistor.","Predice → monta seguro → verifica"]],figs=["\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 900 350\" role=\"img\">\u003crect x=\"0\" y=\"0\" width=\"900\" height=\"350\" rx=\"5\" fill=\"#FCFAF4\"/>\u003crect x=\"12\" y=\"12\" width=\"876\" height=\"226\" rx=\"5\" fill=\"#E4F1FE\"/>\u003crect x=\"120\" y=\"52\" width=\"330\" height=\"145\" rx=\"5\" fill=\"#F2E8FA\"/>\u003crect x=\"450\" y=\"52\" width=\"330\" height=\"145\" rx=\"5\" fill=\"#E4F1FE\"/>\u003
