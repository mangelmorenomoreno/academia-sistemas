<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Presentación · Ley de Ohm</title><style>*{box-sizing:border-box}body{margin:0;background:#fcfaf4;color:#172d47;font:17px/1.6 system-ui,sans-serif}header{background:#10243a;color:white;padding:16px 5%;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}header a{color:#7ddddd}main{max-width:1150px;margin:20px auto;display:grid;grid-template-columns:255px 1fr;gap:18px;padding:0 16px}aside,article{background:white;border:1px solid #dce5ec;border-radius:18px;padding:22px}aside{align-self:start;position:sticky;top:12px}aside a{display:block;color:#496579;text-decoration:none;font-size:14px;padding:6px 8px}aside a.active{background:#ddf6eb;font-weight:700}h1{font-size:clamp(27px,4vw,40px);line-height:1.15}h2{font-size:21px;color:#087f75}p{margin:8px 0 15px}img,svg{width:100%;height:auto;border-radius:12px}.nav{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:14px 0}button,.btn{padding:10px 13px;border-radius:9px;border:1px solid #087f75;background:#fff;color:#087f75;font:inherit;text-decoration:none;cursor:pointer}.primary{background:#087f75;color:white}button:disabled{opacity:.4}progress{width:100%;accent-color:#087f75}.example,.task,.explain{padding:13px 17px;border-radius:12px;background:#fff2d9;margin:14px 0}.task{background:#e4f1fe}.explain{background:#ddf6eb}.small{font-size:13px;color:#52677d}a{color:#087f75}footer{text-align:center;padding:20px;color:#52677d;font-size:13px}@media(max-width:760px){main{grid-template-columns:1fr}aside{position:static}aside nav{max-height:180px;overflow:auto}}@media print{aside,header,.nav,footer{display:none}main{display:block}article{border:0}}</style></head><body><header><strong>Academia Sistemas · Clase 007</strong><a href="../../../../index.html">Inicio</a></header><main style="display:block;max-width:1100px"><article><div class="nav"><button id="prev">← Anterior</button><span id="count"></span><button id="next" class="primary">Siguiente →</button></div><section id="page"></section><p><a href="libro.html">Volver al libro</a></p></article></main><footer>Del electrón al software · Modelos didácticos, no a escala</footer><script>const pages=[["Una relación experimental","Para un conductor óhmico en condiciones físicas estables, la diferencia de potencial es proporcional a la corriente: V=IR. La constante R es resistencia. La ley de Ohm no afirma que cualquier dispositivo tenga una R constante; un diodo o una bombilla que cambia de temperatura puede ser no óhmico.","Si R=100 Ω y V pasa de 1 a 2 V, I pasa de 10 a 20 mA.","Con R fija, triplica V. ¿Qué ocurre con I?","Se triplica.","V ↑ → R fija → I ↑"],["Despejar sin memorizar triángulos","Partiendo de V=IR, divide ambos lados por R para I=V/R o por I para R=V/I si el denominador no es cero. Comprueba las unidades: V/Ω=A y V/A=Ω. La tensión se mide entre puntos y la corriente atraviesa una sección.","6 V y 330 Ω: I=6/330=0,01818 A≈18,2 mA.","12 V y 1 kΩ. Calcula I en mA.","12 mA.","V=IR → I=V/R → R=V/I"],["Prefijos y orden de magnitud","1 kΩ=1000 Ω; 1 MΩ=10⁶ Ω; 1 mA=10⁻³ A. Antes de sustituir, convierte a unidades coherentes. Alternativamente, V/kΩ da mA si se usa consistentemente. Una respuesta de cientos de amperios para un resistor de kiloohmios y pila es una señal de error.","3 V / 2 kΩ = 1,5 mA.","5 V y 470 Ω: I aproximada.","10,64 mA.","kΩ → Ω; A → mA"],["Gráfica corriente-voltaje","En una gráfica I frente a V, el resistor óhmico ideal es una recta que pasa por el origen con pendiente 1/R (A/V). Una resistencia mayor genera una pendiente menor. En una gráfica V frente a I la pendiente sí es R; no confundir los ejes.","Para R=200 Ω la pendiente I/V es 0,005 A/V.","¿Cuál recta I-V es más inclinada: 100 Ω o 1 kΩ?","100 Ω, mayor conductancia.","Eje V → pendiente I/V → R"],["No óhmicos: límites","Un LED tiene una relación corriente-tensión no lineal y depende de temperatura. Una lámpara incandescente cambia de resistencia al calentarse. Se puede calcular V/I en un punto de funcionamiento, pero eso no vuelve constante la relación. El modelo ideal simplifica el comportamiento.","Si a 1 V un dispositivo conduce 1 mA y a 2 V conduce 10 mA, V/I cambia de 1 kΩ a 200 Ω.","¿El dispositivo del ejemplo es óhmico entre esos puntos?","No; la proporcionalidad no se mantiene.","Recta óhmica | curva no lineal"],["Diseñar y comprobar","Para limitar una corriente, calcula primero la resistencia y después comprueba la potencia nominal del componente (clase 008). La fuente real puede tener límites y resistencia interna. La ley de Ohm es una herramienta de predicción, no un sustituto de seguridad.","Para 5 V y una corriente objetivo de 10 mA, R=500 Ω. Un valor comercial 510 Ω da ≈9,8 mA.","A 6 V, objetivo 20 mA. ¿R ideal?","300 Ω; comprobar potencia antes del montaje.","Objetivo → calcula R → verifica"]],figs=["\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 900 350\" role=\"img\">\u003crect x=\"0\" y=\"0\" width=\"900\" height=\"350\" rx=\"5\" fill=\"#FCFAF4\"/>\u003crect x=\"12\" y=\"12\" width=\"876\" height=\"226\" rx=\"5\" fill=\"#E4F1FE\"/>\u003cline x1=\"166\" y1=\"65\" x2=\"166\" y2=\"108\" stroke=\"#172D47\" stroke-width=\"3\" stroke-linecap=\"round\"/>\u003cline x1=\"166\" y1=\"142\" x2=\"166\" y2=\"185\" stroke=\"#172D47\" stroke-width=\"3\" stroke-linecap=\"round\"/>\u003cline x1=\"141\" y1=\"108\" x2=\"191\" y2=\"108\" stroke=\"#172D47\" stroke-width=\"3\" stroke-linecap=\"round\"/>\u003cline x1=\"153\" y1=\"142\" x2=\"179\" y2=\"142\" stroke=\"#172D47\" stroke-width=\"3\" stroke-linecap=\"round\"/>\u003ctext x=\"131\" y=\"107\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"20\" font-weight=\"700\" fill=\"#D64F61\">+\u003c/text>\u003ctext x=\"131\" y=\"147\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"20\" font-weight=\"700\" fill=\"#2475CA\">−\u003c/text>\u003cline x1=\"166\" y1=\
