<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Presentación · Magnetismo y electromagnetismo básico</title><style>*{box-sizing:border-box}body{margin:0;background:#fcfaf4;color:#172d47;font:17px/1.6 system-ui,sans-serif}header{background:#10243a;color:white;padding:16px 5%;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}header a{color:#7ddddd}main{max-width:1150px;margin:20px auto;display:grid;grid-template-columns:255px 1fr;gap:18px;padding:0 16px}aside,article{background:white;border:1px solid #dce5ec;border-radius:18px;padding:22px}aside{align-self:start;position:sticky;top:12px}aside a{display:block;color:#496579;text-decoration:none;font-size:14px;padding:6px 8px}aside a.active{background:#ddf6eb;font-weight:700}h1{font-size:clamp(27px,4vw,40px);line-height:1.15}h2{font-size:21px;color:#087f75}p{margin:8px 0 15px}img,svg{width:100%;height:auto;border-radius:12px}.nav{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:14px 0}button,.btn{padding:10px 13px;border-radius:9px;border:1px solid #087f75;background:#fff;color:#087f75;font:inherit;text-decoration:none;cursor:pointer}.primary{background:#087f75;color:white}button:disabled{opacity:.4}progress{width:100%;accent-color:#087f75}.example,.task,.explain{padding:13px 17px;border-radius:12px;background:#fff2d9;margin:14px 0}.task{background:#e4f1fe}.explain{background:#ddf6eb}.small{font-size:13px;color:#52677d}a{color:#087f75}footer{text-align:center;padding:20px;color:#52677d;font-size:13px}@media(max-width:760px){main{grid-template-columns:1fr}aside{position:static}aside nav{max-height:180px;overflow:auto}}@media print{aside,header,.nav,footer{display:none}main{display:block}article{border:0}}</style></head><body><header><strong>Academia Sistemas · Clase 020</strong><a href="../../../../index.html">Inicio</a></header><main style="display:block;max-width:1100px"><article><div class="nav"><button id="prev">← Anterior</button><span id="count"></span><button id="next" class="primary">Siguiente →</button></div><section id="page"></section><p><a href="libro.html">Volver al libro</a></p></article></main><footer>Del electrón al software · Modelos didácticos, no a escala</footer><script>const pages=[["Imanes y campo magnético","Un imán tiene dos polos y un campo magnético B, medido en teslas (T). Las líneas externas se dibujan de norte a sur y cierran por dentro del imán. No son objetos materiales. Una brújula se orienta aproximadamente según el campo local; los campos pueden superponerse.","Una brújula cerca de un imán cambia orientación.","¿Una línea de campo magnético termina en un polo aislado en el modelo ordinario?","No; las líneas forman lazos.","N → líneas externas → S"],["Corriente produce campo magnético","Una corriente en un conductor genera un campo magnético alrededor del conductor. La regla de mano derecha indica sentido: pulgar en dirección de corriente convencional, dedos se curvan según B. Al invertir corriente se invierte el sentido del campo. La magnitud depende de geometría, corriente y distancia.","En hilo recto largo ideal B=μ₀I/(2πr), en vacío.","Si duplicas distancia de hilo largo con I fija, ¿B?","Se reduce a la mitad.","I en hilo → B circular"],["Bobina y electroimán","Las contribuciones del campo de las vueltas de una bobina se suman. Un núcleo ferromagnético puede aumentar el flujo, con límites como saturación. Un electroimán convierte energía eléctrica en campo magnético y puede ejercer fuerzas; una bobina real también disipa calor.","Más vueltas pueden aumentar el campo si corriente y geometría se mantienen, pero también cambian resistencia e inductancia.","¿Más vueltas garantizan más campo con cualquier fuente fija?","No; la corriente y demás condiciones pueden cambiar.","Espiras + corriente → campo"],["Flujo magnético","En campo uniforme y superficie plana, Φ=B A cosθ, con θ entre B y la normal a la superficie. Se mide en webers (Wb). No es simplemente el valor de B: también importan área y orientación.","B=0,2 T, A=0,01 m², θ=0°: Φ=0,002 Wb.","Misma superficie a 90°. ¿Φ?","0 Wb.","B → superficie → flujo"],["Ley de Faraday y Lenz","La FEM inducida media en N espiras es ε=−N ΔΦ/Δt si cada espira tiene el mismo flujo. El signo de Lenz indica que el efecto de la corriente inducida se opone al cambio de flujo que la produce. No hay FEM por flujo constante en este modelo; importa el cambio.","50 espiras, ΔΦ=0,002 Wb en 0,1 s: |ε|=1 V.","100 espiras, cambio 0,001 Wb en 0,2 s. ¿Magnitud FEM?","0,5 V.","Movimiento imán → ΔΦ → FEM"],["Aplicaciones: motor, generador, transformador","Un motor convierte energía eléctrica en trabajo mecánico mediante interacciones electromagnéticas; un generador transforma trabajo mecánico en energía eléctrica. Un transformador usa flujo variable para acoplar bobinas; no se estudia físicamente con red en este curso. Los campos y sus energías se conservan en el balance total.","Mover un imán más rápido en una bobina puede aumentar FEM si el cambio de flujo por recorrido es el mismo.","¿Por qué un imán inmóvil respecto a una bobina no induce tensión sostenida por sí solo?","El flujo no cambia.","Trabajo mecánico → inducción → energía eléctrica"]],figs=["\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 900 350\" role=\"img\">\u003crect x=\"0\" y=\"0\" width=\"900\" height=\"350\" rx=\"5\" fill=\"#FCFAF4\"/>\u003crect x=\"12\" y=\"12\" width=\"876\" height=\"226\" rx=\"5\" fill=\"#E4F1FE\"/>\u003crect x=\"170\" y=\"100\" width=\"150\" height=\"55\" rx=\"5\" fill=\"#D64F61\"/>\u003crect x=\"320\" y=\"100\" width=\"150\" height=\"55\" rx=\"5\" fill=\"#2475CA\"/>\u003ctext x=\"245\" y=\"136\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"26\" font-weight=\"700\" fill=\"#FFFFFF\">N\u003c/text>\u003ctext x=\"395\" y=\"136\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"26\" font-weight=\"700\" fill=\"#FFFFFF\">S\u
