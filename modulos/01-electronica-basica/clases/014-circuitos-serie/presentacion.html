<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Presentación · Circuitos en serie</title><style>*{box-sizing:border-box}body{margin:0;background:#fcfaf4;color:#172d47;font:17px/1.6 system-ui,sans-serif}header{background:#10243a;color:white;padding:16px 5%;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}header a{color:#7ddddd}main{max-width:1150px;margin:20px auto;display:grid;grid-template-columns:255px 1fr;gap:18px;padding:0 16px}aside,article{background:white;border:1px solid #dce5ec;border-radius:18px;padding:22px}aside{align-self:start;position:sticky;top:12px}aside a{display:block;color:#496579;text-decoration:none;font-size:14px;padding:6px 8px}aside a.active{background:#ddf6eb;font-weight:700}h1{font-size:clamp(27px,4vw,40px);line-height:1.15}h2{font-size:21px;color:#087f75}p{margin:8px 0 15px}img,svg{width:100%;height:auto;border-radius:12px}.nav{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:14px 0}button,.btn{padding:10px 13px;border-radius:9px;border:1px solid #087f75;background:#fff;color:#087f75;font:inherit;text-decoration:none;cursor:pointer}.primary{background:#087f75;color:white}button:disabled{opacity:.4}progress{width:100%;accent-color:#087f75}.example,.task,.explain{padding:13px 17px;border-radius:12px;background:#fff2d9;margin:14px 0}.task{background:#e4f1fe}.explain{background:#ddf6eb}.small{font-size:13px;color:#52677d}a{color:#087f75}footer{text-align:center;padding:20px;color:#52677d;font-size:13px}@media(max-width:760px){main{grid-template-columns:1fr}aside{position:static}aside nav{max-height:180px;overflow:auto}}@media print{aside,header,.nav,footer{display:none}main{display:block}article{border:0}}</style></head><body><header><strong>Academia Sistemas · Clase 014</strong><a href="../../../../index.html">Inicio</a></header><main style="display:block;max-width:1100px"><article><div class="nav"><button id="prev">← Anterior</button><span id="count"></span><button id="next" class="primary">Siguiente →</button></div><section id="page"></section><p><a href="libro.html">Volver al libro</a></p></article></main><footer>Del electrón al software · Modelos didácticos, no a escala</footer><script>const pages=[["Un único camino","Dos elementos están en serie si comparten un nodo sin otras ramas que transporten corriente. En régimen estacionario la misma corriente atraviesa ambos, porque en el nodo no puede acumularse carga indefinidamente. No depende de la forma del dibujo.","Una pila, R1 y R2 en un único lazo tienen I1=I2.","Si circulan 10 mA por R1, ¿cuánto por R2 en serie?","10 mA.","Fuente → R1 → R2 → retorno"],["Resistencia equivalente","En una serie de resistores óhmicos, Vtotal=IR1+IR2+…=I(R1+R2+…). Por eso Req=R1+R2+… . El equivalente reproduce la relación tensión-corriente vista desde los terminales, no todos los detalles internos.","220 Ω +330 Ω =550 Ω.","Calcula Req de 100 Ω, 220 Ω y 680 Ω.","1000 Ω.","R1 + R2 → Req"],["Corriente total y caídas","Calcula primero Req, luego I=Vfuente/Req y finalmente Vi=IRi. Una R mayor tiene una caída mayor si comparte corriente. Las caídas no indican pérdida de carga, sino energía transferida por unidad de carga.","Con 5,5 V, 220 Ω y 330 Ω: I=10 mA, V1=2,2 V, V2=3,3 V.","6 V con 100 Ω y 200 Ω. Calcula I, V1, V2.","20 mA; 2 V y 4 V.","V fuente → V1 + V2"],["Divisor de tensión","Para dos resistores en serie sin carga adicional en el nodo intermedio, Vout=Vin R2/(R1+R2), midiendo sobre R2. Si conectamos una carga, queda en paralelo con R2 y cambia la salida. Un divisor no es una fuente ideal de potencia.","5 V y R1=R2=1 kΩ dan 2,5 V sin carga.","9 V y R1=2 kΩ, R2=1 kΩ. Calcula Vout sin carga.","3 V.","Vin → R1 → Vout → R2"],["Potencia y balance","Como I es igual en serie, Pi=I²Ri. La suma de potencias absorbidas debe igualar la potencia entregada por la fuente ideal en estado estacionario. Evalúa potencia nominal de cada resistor antes de montar.","Con I=10 mA, R1=220 y R2=330 Ω: P1=22 mW, P2=33 mW; total 55 mW.","I=20 mA en 100 y 200 Ω. Calcula cada P.","40 mW y 80 mW; 120 mW total.","P fuente = P1 + P2"],["Fallas y montaje","Un elemento abierto interrumpe todo el lazo; una conexión accidental que puentea un resistor cambia Req y puede aumentar corriente. No provoques puentes. Verifica continuidad sin energía y mide tensión en paralelo; corriente en serie solo bajo supervisión.","Si se abre R2, I=0 en régimen DC ideal y puede aparecer tensión sobre la abertura.","¿Por qué una lámpara en serie puede apagarse si otra se abre?","Porque se interrumpe el camino único.","Abertura → I=0 → diagnóstico"]],figs=["\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 900 350\" role=\"img\">\u003crect x=\"0\" y=\"0\" width=\"900\" height=\"350\" rx=\"5\" fill=\"#FCFAF4\"/>\u003crect x=\"12\" y=\"12\" width=\"876\" height=\"226\" rx=\"5\" fill=\"#E4F1FE\"/>\u003cline x1=\"166\" y1=\"65\" x2=\"166\" y2=\"108\" stroke=\"#172D47\" stroke-width=\"3\" stroke-linecap=\"round\"/>\u003cline x1=\"166\" y1=\"142\" x2=\"166\" y2=\"185\" stroke=\"#172D47\" stroke-width=\"3\" stroke-linecap=\"round\"/>\u003cline x1=\"141\" y1=\"108\" x2=\"191\" y2=\"108\" stroke=\"#172D47\" stroke-width=\"3\" stroke-linecap=\"round\"/>\u003cline x1=\"153\" y1=\"142\" x2=\"179\" y2=\"142\" stroke=\"#172D47\" stroke-width=\"3\" stroke-linecap=\"round\"/>\u003ctext x=\"131\" y=\"107\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"20\" font-weight=\"700\" fill=\"#D64F61\">+\u003c/text>\u003ctext x=\"131\" y=\"147\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"20\" font-weight=\"700\" fill=\"#2475CA\">−\u003c/text>\u003cline x1=\"166\" y1=\"58\" x2=\"166\" y2=\"65\" stroke=\"#172D47\" stroke-width=\"3\" stroke-linecap=\"round\"/>\u003cline x1=\"166\" y1=\"185\" x2=\"166\" y2=\"195\" stroke=\"#172D47\" stroke-width=\"3\" stroke-linecap=\"round\"/>\u003cline x1=\"166\" y1=\"195\" x2=\"735\" y2=\"
