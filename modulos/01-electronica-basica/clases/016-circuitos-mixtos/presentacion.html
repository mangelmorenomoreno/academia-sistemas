<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Presentación · Circuitos mixtos</title><style>*{box-sizing:border-box}body{margin:0;background:#fcfaf4;color:#172d47;font:17px/1.6 system-ui,sans-serif}header{background:#10243a;color:white;padding:16px 5%;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}header a{color:#7ddddd}main{max-width:1150px;margin:20px auto;display:grid;grid-template-columns:255px 1fr;gap:18px;padding:0 16px}aside,article{background:white;border:1px solid #dce5ec;border-radius:18px;padding:22px}aside{align-self:start;position:sticky;top:12px}aside a{display:block;color:#496579;text-decoration:none;font-size:14px;padding:6px 8px}aside a.active{background:#ddf6eb;font-weight:700}h1{font-size:clamp(27px,4vw,40px);line-height:1.15}h2{font-size:21px;color:#087f75}p{margin:8px 0 15px}img,svg{width:100%;height:auto;border-radius:12px}.nav{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:14px 0}button,.btn{padding:10px 13px;border-radius:9px;border:1px solid #087f75;background:#fff;color:#087f75;font:inherit;text-decoration:none;cursor:pointer}.primary{background:#087f75;color:white}button:disabled{opacity:.4}progress{width:100%;accent-color:#087f75}.example,.task,.explain{padding:13px 17px;border-radius:12px;background:#fff2d9;margin:14px 0}.task{background:#e4f1fe}.explain{background:#ddf6eb}.small{font-size:13px;color:#52677d}a{color:#087f75}footer{text-align:center;padding:20px;color:#52677d;font-size:13px}@media(max-width:760px){main{grid-template-columns:1fr}aside{position:static}aside nav{max-height:180px;overflow:auto}}@media print{aside,header,.nav,footer{display:none}main{display:block}article{border:0}}</style></head><body><header><strong>Academia Sistemas · Clase 016</strong><a href="../../../../index.html">Inicio</a></header><main style="display:block;max-width:1100px"><article><div class="nav"><button id="prev">← Anterior</button><span id="count"></span><button id="next" class="primary">Siguiente →</button></div><section id="page"></section><p><a href="libro.html">Volver al libro</a></p></article></main><footer>Del electrón al software · Modelos didácticos, no a escala</footer><script>const pages=[["Topología antes de números","Un circuito mixto tiene combinaciones serie y paralelo. Etiqueta nodos antes de reducir: dos resistores están en paralelo si comparten ambos nodos; están en serie si el nodo intermedio no tiene otra rama que conduzca. No se identifican por orientación visual.","R1 en serie con R2||R3: R2 y R3 comparten nodos, R1 alimenta el conjunto.","¿Dos resistores que comparten un solo nodo con otra rama están en serie necesariamente?","No.","Etiqueta A, B, C → identifica ramas"],["Reducción de paralelo","Primero reduce un grupo de paralelo claramente identificable; luego combina con los elementos en serie. Conserva el mapa de qué resistencia representa cada grupo.","R2=R3=600 Ω: Rp=300 Ω. R1=300 Ω en serie: Req=600 Ω.","R1=100 Ω, R2=200 Ω, R3=200 Ω en paralelo. Calcula Req.","200 Ω.","R2 || R3 → Rp → R1 + Rp"],["Corriente total y reconstrucción","Una vez hallado Req, It=V/Req. Después deshaz reducciones para hallar tensiones y corrientes originales. En R1 serie pasa It; en grupo paralelo Vp=ItRp, con I2=Vp/R2 e I3=Vp/R3.","6 V y Req=600 Ω: It=10 mA; R1=300 Ω cae 3 V; paralelo tiene 3 V; cada 600 Ω conduce 5 mA.","5 V, R1=100 Ω, R2=R3=200 Ω. Calcula It y corriente de cada rama.","25 mA; 12,5 mA cada rama.","Req → It → Vp → I2/I3"],["Comprobar carga y energía","Verifica It=I2+I3 y Vfuente=V1+Vp. Calcula Pi=ViIi; la suma de potencias debe igualar VfuenteIt en el modelo ideal. Estos balances detectan errores de reducción o unidades.","En ejemplo 6 V, Pfuente=60 mW; P1=30 mW; P2=P3=15 mW.","¿Si It=20 mA e I2=8 mA, cuánto I3 en nodo sin acumulación?","12 mA.","It = I2 + I3 | V = V1 + Vp"],["Cuando no hay reducción simple","Una red puente puede no reducirse solo con serie y paralelo: las ramas intermedias comparten nodos con más conexiones. No fuerces una reducción incorrecta; se pueden usar ecuaciones de Kirchhoff, análisis nodal o de mallas. Esas herramientas vienen a continuación.","Un puente de Wheatstone desequilibrado con rama central no es en general una simple combinación de dos series paralelas.","¿Qué método usar si no puedes identificar grupo serie/paralelo?","Kirchhoff o análisis nodal/mallas.","Red puente → ecuaciones → solución"],["Interpretar resultados físicos","Un resultado de Req en paralelo mayor que la menor rama indica error. Una caída negativa puede ser correcta si la referencia se invirtió; no lo es una potencia disipada negativa en resistor con convención pasiva. Comparar predicción con medida requiere tolerancia e incertidumbre.","En serie con 100 Ω y paralelo de dos 200 Ω, Req=200 Ω; el paralelo aislado vale 100 Ω.","Si agregas una tercera rama de 200 Ω al paralelo, ¿Req total sube o baja?","Baja a ≈166,67 Ω.","Predice → reduce → reconstruye → verifica"]],figs=["\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 900 350\" role=\"img\">\u003crect x=\"0\" y=\"0\" width=\"900\" height=\"350\" rx=\"5\" fill=\"#FCFAF4\"/>\u003crect x=\"12\" y=\"12\" width=\"876\" height=\"226\" rx=\"5\" fill=\"#E4F1FE\"/>\u003cline x1=\"166\" y1=\"65\" x2=\"166\" y2=\"108\" stroke=\"#172D47\" stroke-width=\"3\" stroke-linecap=\"round\"/>\u003cline x1=\"166\" y1=\"142\" x2=\"166\" y2=\"185\" stroke=\"#172D47\" stroke-width=\"3\" stroke-linecap=\"round\"/>\u003cline x1=\"141\" y1=\"108\" x2=\"191\" y2=\"108\" stroke=\"#172D47\" stroke-width=\"3\" stroke-linecap=\"round\"/>\u003cline x1=\"153\" y1=\"142\" x2=\"179\" y2=\"142\" stroke=\"#172D47\" stroke-width=\"3\" stroke-linecap=\"round\"/>\u003ctext x=\"131\" y=\"107\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"20\" font-weight=\"700\" fill=\"#D64F61\">+\u003c/text>\u003ctext x=\"131\" y=\"147\" text-anchor=\"middle\" font-family=\"Arial,s
