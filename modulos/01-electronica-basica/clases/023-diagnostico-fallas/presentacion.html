<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Presentación · Diagnóstico de fallas eléctricas</title><style>*{box-sizing:border-box}body{margin:0;background:#fcfaf4;color:#172d47;font:17px/1.6 system-ui,sans-serif}header{background:#10243a;color:white;padding:16px 5%;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}header a{color:#7ddddd}main{max-width:1150px;margin:20px auto;display:grid;grid-template-columns:255px 1fr;gap:18px;padding:0 16px}aside,article{background:white;border:1px solid #dce5ec;border-radius:18px;padding:22px}aside{align-self:start;position:sticky;top:12px}aside a{display:block;color:#496579;text-decoration:none;font-size:14px;padding:6px 8px}aside a.active{background:#ddf6eb;font-weight:700}h1{font-size:clamp(27px,4vw,40px);line-height:1.15}h2{font-size:21px;color:#087f75}p{margin:8px 0 15px}img,svg{width:100%;height:auto;border-radius:12px}.nav{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:14px 0}button,.btn{padding:10px 13px;border-radius:9px;border:1px solid #087f75;background:#fff;color:#087f75;font:inherit;text-decoration:none;cursor:pointer}.primary{background:#087f75;color:white}button:disabled{opacity:.4}progress{width:100%;accent-color:#087f75}.example,.task,.explain{padding:13px 17px;border-radius:12px;background:#fff2d9;margin:14px 0}.task{background:#e4f1fe}.explain{background:#ddf6eb}.small{font-size:13px;color:#52677d}a{color:#087f75}footer{text-align:center;padding:20px;color:#52677d;font-size:13px}@media(max-width:760px){main{grid-template-columns:1fr}aside{position:static}aside nav{max-height:180px;overflow:auto}}@media print{aside,header,.nav,footer{display:none}main{display:block}article{border:0}}</style></head><body><header><strong>Academia Sistemas · Clase 023</strong><a href="../../../../index.html">Inicio</a></header><main style="display:block;max-width:1100px"><article><div class="nav"><button id="prev">← Anterior</button><span id="count"></span><button id="next" class="primary">Siguiente →</button></div><section id="page"></section><p><a href="libro.html">Volver al libro</a></p></article></main><footer>Del electrón al software · Modelos didácticos, no a escala</footer><script>const pages=[["Método de ingeniería","Define comportamiento esperado, síntomas, condiciones y límites. Formula hipótesis comprobables antes de intervenir. Distingue causa, síntoma y evidencia. Una falla intermitente puede requerir registrar condiciones y repetir observación, no adivinar.","LED apagado: hipótesis fuente sin tensión, interruptor abierto, polaridad o conexión incorrecta.","¿Una lámpara apagada demuestra que el LED está dañado?","No; hay varias hipótesis.","Síntoma → hipótesis → prueba"],["Inspección y seguridad","Desenergiza antes de tocar cableado; verifica ausencia de tensión y descarga segura de capacitores si existen. Inspecciona puentes, componentes, filas de protoboard y polaridad. No huelas de cerca, toques componentes calientes ni energices un circuito sospechoso de corto.","Una pata del resistor en la misma fila que la otra puede puentear su función.","¿Qué haces al encontrar un posible corto?","No energizar; desconectar y corregir bajo supervisión.","Desconecta → inspecciona → corrige"],["Pruebas de continuidad y resistencia","Con alimentación desconectada, verifica cables y nodos esperados. Aísla componentes si hay caminos alternos. El multímetro en continuidad tiene umbral, por eso un pitido no prueba resistencia exactamente cero. Compara valor con tolerancia e incertidumbre.","330 Ω ±5% medidos 340 Ω aislado es compatible si incertidumbre razonable.","¿Por qué medir resistencia dentro de una red puede engañar?","Puede medir caminos paralelos y no solo ese componente.","Nodo → continuidad → componente aislado"],["Medición de tensión por etapas","Tras verificar seguridad, energiza bajo supervisión. Mide fuente entre bornes y después cada nodo respecto a referencia. En circuito serie, una abertura puede dejar casi toda tensión sobre ella y cero sobre otros elementos, según caminos y medidor. No usar medidas de Ω con fuente conectada.","Fuente 3 V, interruptor abierto y carga conectada a retorno: tensión sobre contacto abierto≈3 V en modelo ideal.","Si Vfuente=0, ¿qué hipótesis revisas antes de sustituir LED?","Fuente, conexión, interruptor de alimentación, configuración y referencia.","Fuente → nodo A → nodo B → retorno"],["Predicción frente a medición","Calcula valor esperado con tolerancias. Para resistor, I inferida=VR/R evita abrir el circuito si se conoce R. El error relativo respecto a referencia no nula es |medido−esperado|/|esperado|×100%; no implica por sí solo falla si incertidumbre/modelo explican diferencia.","Esperado 3,00 V y medido 2,94 V: desviación relativa 2%.","Esperado 10 mA, medido 9,5 mA. ¿Desviación?","5%.","Esperado ↔ medido → diferencia"],["Documentar y confirmar","Cambia una cosa por vez; registra resultado y repite prueba. Una reparación exitosa exige verificar comportamiento esperado y que no introdujo otra falla. El informe incluye esquema, fotos/dibujos, valores, hipótesis descartadas, causa confirmada y prevención. En software el mismo patrón se usa para depurar.","Si invertir LED correctamente restaura funcionamiento, documenta polaridad inicial y verifica corriente limitada.","¿Por qué no cambiar tres componentes simultáneamente?","Se pierde evidencia sobre causa y se pueden introducir fallas.","Cambio único → prueba → evidencia → cierre"]],figs=["\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 900 350\" role=\"img\">\u003crect x=\"0\" y=\"0\" width=\"900\" height=\"350\" rx=\"5\" fill=\"#FCFAF4\"/>\u003crect x=\"12\" y=\"12\" width=\"876\" height=\"226\" rx=\"5\" fill=\"#E4F1FE\"/>\u003cline x1=\"166\" y1=\"65\" x2=\"166\" y2=\"108\" stroke=\"#172D47\" stroke-width=\"3\" stroke-linecap=\"round\"/>\u003cline x1=\"166\" y1=\"142\" x2=\"166\" y2=\"185\" stroke=\"#172D
