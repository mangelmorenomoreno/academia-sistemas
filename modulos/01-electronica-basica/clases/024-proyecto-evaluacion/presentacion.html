<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Presentación · Proyecto final, evaluación y sustentación</title><style>*{box-sizing:border-box}body{margin:0;background:#fcfaf4;color:#172d47;font:17px/1.6 system-ui,sans-serif}header{background:#10243a;color:white;padding:16px 5%;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}header a{color:#7ddddd}main{max-width:1150px;margin:20px auto;display:grid;grid-template-columns:255px 1fr;gap:18px;padding:0 16px}aside,article{background:white;border:1px solid #dce5ec;border-radius:18px;padding:22px}aside{align-self:start;position:sticky;top:12px}aside a{display:block;color:#496579;text-decoration:none;font-size:14px;padding:6px 8px}aside a.active{background:#ddf6eb;font-weight:700}h1{font-size:clamp(27px,4vw,40px);line-height:1.15}h2{font-size:21px;color:#087f75}p{margin:8px 0 15px}img,svg{width:100%;height:auto;border-radius:12px}.nav{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:14px 0}button,.btn{padding:10px 13px;border-radius:9px;border:1px solid #087f75;background:#fff;color:#087f75;font:inherit;text-decoration:none;cursor:pointer}.primary{background:#087f75;color:white}button:disabled{opacity:.4}progress{width:100%;accent-color:#087f75}.example,.task,.explain{padding:13px 17px;border-radius:12px;background:#fff2d9;margin:14px 0}.task{background:#e4f1fe}.explain{background:#ddf6eb}.small{font-size:13px;color:#52677d}a{color:#087f75}footer{text-align:center;padding:20px;color:#52677d;font-size:13px}@media(max-width:760px){main{grid-template-columns:1fr}aside{position:static}aside nav{max-height:180px;overflow:auto}}@media print{aside,header,.nav,footer{display:none}main{display:block}article{border:0}}</style></head><body><header><strong>Academia Sistemas · Clase 024</strong><a href="../../../../index.html">Inicio</a></header><main style="display:block;max-width:1100px"><article><div class="nav"><button id="prev">← Anterior</button><span id="count"></span><button id="next" class="primary">Siguiente →</button></div><section id="page"></section><p><a href="libro.html">Volver al libro</a></p></article></main><footer>Del electrón al software · Modelos didácticos, no a escala</footer><script>const pages=[["Requisitos y seguridad","Diseñar iluminación de baja tensión con interruptor, un LED rojo de datos conocidos y resistor limitador. Fuente limitada de 3 V o portapilas adecuado bajo supervisión. Debe encender y apagar de forma reproducible, no sobrepasar límites de corriente, tensión ni potencia y permitir diagnóstico seguro.","Requisito ejemplo: I objetivo≤5 mA, LED Vf aproximada 1,8–2,2 V según datos.","¿Qué dato del LED necesitas además de color?","Vf a corriente prevista, corriente máxima, polaridad y límites.","Requisitos → datos → restricciones"],["Cálculo y selección","Para 3 V y Vf≈1,8 V mínimo supuesto a corriente relevante, R≥(3−1,8)/0,005=240 Ω. Usar 330 Ω nominal, comprobar tolerancia y tensión máxima real. Con 3 V ideal y Vf≈2 V: I≈3,03 mA; P_R≈3,03 mW. La caída real varía; si no se cumplen requisitos, recalcular con datos.","Con 330 Ω ±5%, Rmin=313,5 Ω. Si Vs=3,2 V y Vfmin=1,8 V, I aproximada≤4,47 mA.","Con Vs=3 V y Vf=1,8 V, R=330 Ω. ¿I?","≈3,64 mA.","Vs−Vf → R → I y P"],["Esquema y montaje","Dibuja fuente, interruptor, resistor y LED en serie, con polaridades y referencia. Identifica nodos de protoboard; desenergiza al cablear. Comprueba continuidad prevista y ausencia de puentes, y solicita revisión antes de energizar. No conectes amperímetro directamente a fuente.","El orden de resistor e interruptor en una serie ideal no altera I, pero sí potenciales de nodos intermedios.","¿El resistor puede eliminarse si el LED no enciende?","No; diagnostica causa sin eliminar protección.","Pila → interruptor → R → LED → retorno"],["Pruebas y balance","Con fuente revisada, mide Vs, VR y VLED con voltímetro DC en paralelo; calcula I≈VR/R medido aislado previamente. Comprueba Vs≈VR+VLED y Pfuente≈PR+PLED en modelo ideal. Registra incertidumbre, comportamiento abierto/cerrado y repetición. No persigas cero residual exacto.","Si Vs=3,0 V, VR=1,05 V, VLED=1,95 V y R=330 Ω, I≈3,18 mA; residual 0 V.","Con VR=1,2 V y R=330 Ω, calcula I.","≈3,64 mA.","Medidas → KVL → I → energía"],["Diagnóstico y mejora","El docente propone una abertura o conexión invertida segura previamente revisada. Estudiante localiza con hipótesis y mediciones, desconecta para corregir y repite pruebas. Propón mejora justificada, por ejemplo indicador de estado o cambio de R dentro de límites; no añadir cargas sin recalcular.","Una resistencia mayor reduce I a V fija si la aproximación Vf se mantiene.","¿Qué evidencia demuestra que corregiste una abertura?","Continuidad restaurada sin energía y funcionamiento repetible tras revisión.","Falla → hipótesis → prueba → corrección"],["Sustentación: integrar fundamentos","Explica de dónde viene energía, cómo campo provoca deriva, por qué resistor transfiere energía, qué significa voltaje, cómo se conserva carga y energía, por qué LED es no óhmico y cómo medir seguro. Entrega memoria técnica, esquema, cálculos, tabla, dibujos y conclusiones. La nota mínima propuesta es 80/100 y seguridad obligatoria.","Un proyecto que funciona pero no puede explicarse no demuestra dominio suficiente.","¿En qué se diferencian KCL y KVL en tu circuito?","KCL: carga/corrientes; KVL: balance de tensiones y energía por carga.","Átomo → circuito → diseño → defensa"]],figs=["\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 900 350\" role=\"img\">\u003crect x=\"0\" y=\"0\" width=\"900\" height=\"350\" rx=\"5\" fill=\"#FCFAF4\"/>\u003crect x=\"12\" y=\"12\" width=\"876\" height=\"226\" rx=\"5\" fill=\"#E4F1FE\"/>\u003cline x1=\"166\" y1=\"65\" x2=\"166\" y2=\"108\" stroke=\"#172D47\" stroke-width=\"3\" stroke-linecap=\"round\"/>\u003cline x1=\"166\" y1=\"142\" x2=\"166\" y2=\"185\" stroke=\"#172D47\" stroke-width=\"3
