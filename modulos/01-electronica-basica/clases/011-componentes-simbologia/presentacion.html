<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Presentación · Componentes electrónicos y simbología</title><style>*{box-sizing:border-box}body{margin:0;background:#fcfaf4;color:#172d47;font:17px/1.6 system-ui,sans-serif}header{background:#10243a;color:white;padding:16px 5%;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}header a{color:#7ddddd}main{max-width:1150px;margin:20px auto;display:grid;grid-template-columns:255px 1fr;gap:18px;padding:0 16px}aside,article{background:white;border:1px solid #dce5ec;border-radius:18px;padding:22px}aside{align-self:start;position:sticky;top:12px}aside a{display:block;color:#496579;text-decoration:none;font-size:14px;padding:6px 8px}aside a.active{background:#ddf6eb;font-weight:700}h1{font-size:clamp(27px,4vw,40px);line-height:1.15}h2{font-size:21px;color:#087f75}p{margin:8px 0 15px}img,svg{width:100%;height:auto;border-radius:12px}.nav{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:14px 0}button,.btn{padding:10px 13px;border-radius:9px;border:1px solid #087f75;background:#fff;color:#087f75;font:inherit;text-decoration:none;cursor:pointer}.primary{background:#087f75;color:white}button:disabled{opacity:.4}progress{width:100%;accent-color:#087f75}.example,.task,.explain{padding:13px 17px;border-radius:12px;background:#fff2d9;margin:14px 0}.task{background:#e4f1fe}.explain{background:#ddf6eb}.small{font-size:13px;color:#52677d}a{color:#087f75}footer{text-align:center;padding:20px;color:#52677d;font-size:13px}@media(max-width:760px){main{grid-template-columns:1fr}aside{position:static}aside nav{max-height:180px;overflow:auto}}@media print{aside,header,.nav,footer{display:none}main{display:block}article{border:0}}</style></head><body><header><strong>Academia Sistemas · Clase 011</strong><a href="../../../../index.html">Inicio</a></header><main style="display:block;max-width:1100px"><article><div class="nav"><button id="prev">← Anterior</button><span id="count"></span><button id="next" class="primary">Siguiente →</button></div><section id="page"></section><p><a href="libro.html">Volver al libro</a></p></article></main><footer>Del electrón al software · Modelos didácticos, no a escala</footer><script>const pages=[["Leer símbolos y nodos","Los esquemas usan símbolos convencionales para representar función y terminales. Una línea representa conductor ideal; un punto de unión indica nodo compartido. Dos líneas que se cruzan sin unión suelen no conectarse, según convención del dibujo. Verifica siempre la leyenda.","Tres terminales unidos por el mismo nodo ideal tienen el mismo potencial.","¿Un cruce sin punto representa siempre una unión?","No; revisar convención, normalmente no.","Cable → nodo → rama"],["Fuente y resistor","La pila se dibuja con líneas larga (+) y corta (−). Un resistor puede representarse con zigzag o rectángulo, según norma. Su símbolo no indica polaridad en resistores comunes. La etiqueta R1 y el valor identifican el componente.","R1=330 Ω conectado a una pila: intercambiar extremos de un resistor común no cambia su función.","¿Qué diferencia una pila de un resistor en el esquema?","Fuente con polaridad; resistor limita corriente y transfiere energía.","Pila | resistor"],["Interruptor y protección","El interruptor representa un contacto que abre o cierra un camino. Normalmente abierto significa que en reposo está abierto, no que tenga tensión cero. El fusible tiene símbolo y valor nominal según diseño; no debe confundirse con interruptor reutilizable.","Un pulsador normalmente abierto cierra mientras se presiona.","¿Qué ocurre al soltar un pulsador NO ideal?","Se abre de nuevo.","Contacto abierto → cerrado"],["Condensador y diodo","Un condensador ideal usa dos placas; uno polarizado exige orientación según especificación. Un diodo se representa con símbolo que incluye barra de cátodo; conduce de forma asimétrica. Un LED añade flechas de luz hacia afuera. No conectarlos a una fuente sin comprobar polaridad, tensión y limitación de corriente.","En un LED común la barra del símbolo identifica cátodo K; verificar encapsulado y hoja de datos.","¿Qué indican las flechas que salen del símbolo LED?","Emisión de luz.","Capacitor | diodo | LED"],["Esquema frente a montaje físico","Un dibujo de circuito puede estirarse o girarse sin cambiar su topología. Para pasar al montaje, identifica nodos, terminales y valores. Los componentes reales tienen tamaño, tolerancia y límites que el símbolo no muestra. La protoboard se estudia en clase 013.","Un resistor y un LED en serie pueden dibujarse horizontal o verticalmente: si comparten los mismos nodos, son equivalentes.","Dibuja la misma serie de dos formas.","Se aceptan dibujos con nodos equivalentes.","Símbolo → terminales → montaje"],["Referencia y etiquetas","GND suele ser referencia de potencial, no necesariamente conexión física a la Tierra. VCC/VDD suelen identificar alimentación; no todas las placas usan esas etiquetas igual. Un esquema debe indicar nombres, unidades, polaridad y referencia.","Si VDD=3,3 V respecto a GND, no implica que el nodo GND esté conectado a tierra doméstica.","¿GND siempre significa tierra física?","No; puede ser referencia local.","GND → referencia 0 V | VDD → alimentación"]],figs=["\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 900 350\" role=\"img\">\u003crect x=\"0\" y=\"0\" width=\"900\" height=\"350\" rx=\"5\" fill=\"#FCFAF4\"/>\u003crect x=\"12\" y=\"12\" width=\"876\" height=\"226\" rx=\"5\" fill=\"#E4F1FE\"/>\u003cline x1=\"125\" y1=\"66\" x2=\"125\" y2=\"109\" stroke=\"#172D47\" stroke-width=\"3\" stroke-linecap=\"round\"/>\u003cline x1=\"125\" y1=\"143\" x2=\"125\" y2=\"186\" stroke=\"#172D47\" stroke-width=\"3\" stroke-linecap=\"round\"/>\u003cline x1=\"100\" y1=\"109\" x2=\"150\" y2=\"109\" stroke=\"#172D47\" stroke-width=\"3\" stroke-linecap=\"round\"/>\u003cline x1=\"112\" y1=\"143\" x2=\"138\" y2=\"143\" stroke=\"#1
