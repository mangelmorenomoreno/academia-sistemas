<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Presentación · Corriente eléctrica y movimiento de electrones</title><style>*{box-sizing:border-box}body{margin:0;background:#fcfaf4;color:#172d47;font:17px/1.6 system-ui,sans-serif}header{background:#10243a;color:white;padding:16px 5%;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}header a{color:#7ddddd}main{max-width:1150px;margin:20px auto;display:grid;grid-template-columns:255px 1fr;gap:18px;padding:0 16px}aside,article{background:white;border:1px solid #dce5ec;border-radius:18px;padding:22px}aside{align-self:start;position:sticky;top:12px}aside a{display:block;color:#496579;text-decoration:none;font-size:14px;padding:6px 8px}aside a.active{background:#ddf6eb;font-weight:700}h1{font-size:clamp(27px,4vw,40px);line-height:1.15}h2{font-size:21px;color:#087f75}p{margin:8px 0 15px}img,svg{width:100%;height:auto;border-radius:12px}.nav{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:14px 0}button,.btn{padding:10px 13px;border-radius:9px;border:1px solid #087f75;background:#fff;color:#087f75;font:inherit;text-decoration:none;cursor:pointer}.primary{background:#087f75;color:white}button:disabled{opacity:.4}progress{width:100%;accent-color:#087f75}.example,.task,.explain{padding:13px 17px;border-radius:12px;background:#fff2d9;margin:14px 0}.task{background:#e4f1fe}.explain{background:#ddf6eb}.small{font-size:13px;color:#52677d}a{color:#087f75}footer{text-align:center;padding:20px;color:#52677d;font-size:13px}@media(max-width:760px){main{grid-template-columns:1fr}aside{position:static}aside nav{max-height:180px;overflow:auto}}@media print{aside,header,.nav,footer{display:none}main{display:block}article{border:0}}</style></head><body><header><strong>Academia Sistemas · Clase 005</strong><a href="../../../../index.html">Inicio</a></header><main style="display:block;max-width:1100px"><article><div class="nav"><button id="prev">← Anterior</button><span id="count"></span><button id="next" class="primary">Siguiente →</button></div><section id="page"></section><p><a href="libro.html">Volver al libro</a></p></article></main><footer>Del electrón al software · Modelos didácticos, no a escala</footer><script>const pages=[["Corriente: flujo de carga","La corriente media es I=ΔQ/Δt, con signo según un sentido de referencia. Un amperio equivale a un culombio por segundo. La carga que cruza una sección de cable no es lo mismo que la cantidad de carga presente en todo el cable.","Si atraviesan 6 C en 3 s, I=2 A.","12 C cruzan en 4 s. Calcula I.","3 A.","Sección del cable → carga que cruza → tiempo"],["Portadores y neutralidad","Un metal puede ser globalmente neutro y contener electrones móviles. Sin campo aplicado, sus movimientos microscópicos no generan deriva neta. Con campo, aparece una pequeña velocidad media de deriva; los iones de la red no se desplazan a lo largo del cable como los electrones.","Un conductor neutro no tiene carga neta, pero puede transportar corriente.","¿Un cable neutro es necesariamente incapaz de conducir?","No; neutralidad y movilidad son diferentes.","Red de iones → electrones móviles → deriva"],["Sentido convencional frente a electrones","Se define corriente convencional en la dirección de flujo de carga positiva. En un cable metálico externo de una pila, la corriente va del borne positivo al negativo; los electrones derivan en sentido contrario. En otros medios puede haber portadores positivos, negativos o ambos.","En un tramo con corriente convencional hacia la derecha, la deriva electrónica es hacia la izquierda.","Dibuja I hacia arriba. ¿Hacia dónde deriva el electrón en metal?","Hacia abajo.","I → | electrón ←"],["Señal y deriva no tienen la misma rapidez","Al cerrar un interruptor, el campo electromagnético se reorganiza a través del circuito a una velocidad finita que depende del medio y geometría, normalmente mucho mayor que la velocidad de deriva. Los portadores ya existen a lo largo del conductor. No hace falta que un electrón individual recorra toda la distancia antes de que la lámpara responda.","Como analogía limitada, una fila de fichas puede transmitir un empuje aunque cada ficha se desplace poco. No representa literalmente el campo electromagnético.","¿Qué se propaga rápidamente: el electrón individual o la perturbación electromagnética?","La perturbación electromagnética.","Interruptor → campo se establece → deriva local"],["Circuito cerrado y conservación de carga","En un circuito DC ideal cerrado se establece corriente sostenida si la fuente mantiene tensión. En un circuito abierto no hay trayectoria completa para esa corriente. En régimen estacionario, no se acumula carga indefinidamente en un tramo: entra tanta carga por tiempo como sale.","Si 0,2 A cruzan una resistencia durante 10 s, pasan 2 C por cada terminal en régimen estacionario.","0,05 A durante 20 s: ¿cuánta carga cruza?","1 C.","Fuente → resistencia → retorno"],["Escalas y aplicaciones","Los circuitos electrónicos suelen usar miliamperios: 1 mA=10⁻³ A. La corriente máxima depende de la fuente, carga y protecciones; una fuente de 5 V no impone por sí sola un número fijo de amperios. La capacidad de una batería en Ah mide carga, no corriente instantánea.","20 mA=0,020 A. Una carga de 1,2 C en 60 s equivale a 20 mA.","Convierte 350 mA a A y calcula Q en 2 s.","0,350 A; 0,7 C.","mA → A → Q=It"]],figs=["\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 900 350\" role=\"img\">\u003crect x=\"0\" y=\"0\" width=\"900\" height=\"350\" rx=\"5\" fill=\"#FCFAF4\"/>\u003crect x=\"12\" y=\"12\" width=\"876\" height=\"226\" rx=\"5\" fill=\"#E4F1FE\"/>\u003crect x=\"80\" y=\"75\" width=\"740\" height=\"110\" rx=\"5\" fill=\"#B9CADD\"/>\u003cline x1=\"450\" y1=\"62\" x2=\"450\" y2=\"197\" stroke=\"#A96519\" stroke-width=\"3\" stroke-linecap=\"round\"/>\u003ccircle cx=\"120\" cy=\"130\" r=\"14\" fill=\"#2475CA\"/>\u003ctext x
